<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暖境边陲 · 自产道具图鉴 v3</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f1e7;color:#4a3b2a}
h1{font-size:20px;padding:14px 20px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:0 20px 30px}
.card{background:#fffdf8;border:1px solid #e5dcc8;border-radius:12px;padding:8px;text-align:center}
.card canvas{width:100%;height:190px;border-radius:8px;background:#efe9db}
.card .n{font-weight:600;margin-top:6px}
.card .s{font-size:11px;color:#8a7a60}
</style>
</head>
<body>
<h1>自产道具图鉴 · 23 件（概念图 → Hunyuan3D 形状 → 水彩贴图，Draco 压缩）</h1>
<div class="grid" id="grid"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const PROPS = [
 ['tree_oak','橡树'],['tree_pine','松树'],['tree_dead','枯木'],['tree_blossom','花树'],
 ['bush_large','大灌木'],['berry_bush','浆果丛'],['flowers','野花'],['grass_tuft','草丛'],
 ['rock_big','巨石'],['rocks_small','碎石'],['stump','树桩'],['mushrooms','蘑菇'],
 ['barrel','木桶'],['crate','木箱'],['cart','手推车'],['fence','木栅栏'],
 ['haystack','草垛'],['lantern','灯笼'],['signpost','路牌'],['campfire','篝火'],
 ['villager_m','村民·男'],['villager_f','村民·女'],['villager_old','村民·长者'],
];
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const enc = p => p.split('/').map(encodeURIComponent).join('/');
for (const [id, name] of PROPS) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<canvas></canvas><div class="n">${name}</div><div class="s">prop-${id}</div>`;
  grid.appendChild(card);
  const cvs = card.querySelector('canvas');
  let r = null, sc = null, alive = false;
  function start() {
    if (r) return;
    r = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    sc = new THREE.Scene(); sc.background = new THREE.Color(0xefe9db);
    const cam = new THREE.PerspectiveCamera(40, 1, .1, 50); cam.position.set(1.6, 1.3, 2.2); cam.lookAt(0, .35, 0);
    sc.add(new THREE.HemisphereLight(0xfff4e2, 0x8a7a60, 1.4), new THREE.DirectionalLight(0xffffff, 2).translateY(3).translateX(2));
    loader.load(enc(`ai3d-mirror/prop-${id}.glb`) + '?v=4', g => {
      const o = g.scene;
      o.traverse(m => {
        if (!m.isMesh) return;
        m.castShadow = false;
        const mats = Array.isArray(m.material) ? m.material : [m.material];
        mats.forEach(mm => { if (mm.metalness !== undefined) { mm.metalness = 0; mm.roughness = 1; } });
      });
      const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
      o.scale.setScalar(1.4 / Math.max(size.x, size.y, size.z));
      const c2 = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
      o.position.set(-c2.x, -box.min.y * o.scale.x, -c2.z);
      sc.add(o);
      render();
    });
    const fit = () => { const w = cvs.clientWidth, h = cvs.clientHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); render(); };
    function render() { if (alive && r) r.render(sc, cam); }
    fit(); new ResizeObserver(fit).observe(cvs);
  }
  new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { alive = true; start(); }
    else if (r) { alive = false; r.forceContextLoss(); r.dispose(); r = null; sc = null; }
  }), { rootMargin: '200px' }).observe(cvs);
}
</script>
</body>
</html>
