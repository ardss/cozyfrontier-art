<!DOCTYPE html><html><head><meta charset="utf8"><style>
body{margin:0;background:#2b2420;font-family:sans-serif;color:#eee}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:760px;margin:10px auto;background:#3a3128;border-radius:10px;overflow:hidden}
h3{margin:10px;color:#ffd9a0}
img{width:100%;aspect-ratio:1/1;display:block;background:#2b2420;object-fit:contain}
#work{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<h3>瞭望塔：左=输入水彩图，右=3D</h3><div class="pair"><img src="ai3d-mirror/s2-r5c1.png"><img id="s1"></div>
<h3>水井：左=输入水彩图，右=3D</h3><div class="pair"><img src="ai3d-mirror/s3-r2c4.png"><img id="s2"></div>
<canvas id="work" width="768" height="768"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const work=document.getElementById('work');
const renderer=new THREE.WebGLRenderer({canvas:work,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(768,768,false);renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2b2420);
const k=new THREE.DirectionalLight(0xfff0d8,1.9);k.position.set(3,5,2);
const b=new THREE.DirectionalLight(0xffe8cc,0.7);b.position.set(-3,-2,-4);
scene.add(k,b,new THREE.HemisphereLight(0xfff4e2,0x8a7358,0.85),new THREE.AmbientLight(0xffffff,0.35));
const cam=new THREE.PerspectiveCamera(45,1,0.01,100);
const loader=new GLTFLoader();
const jobs=[['s1','wc-watchtower-paint.glb'],['s2','wc-well-paint.glb']];
let i=0;
function next(){
  if(i>=jobs.length){renderer.forceContextLoss();return;}
  const [id,f]=jobs[i++];
  loader.load(enc('ai3d-mirror/'+f)+'?v=3',g=>{
    scene.add(g.scene);
    const bx=new THREE.Box3().setFromObject(g.scene),c=bx.getCenter(new THREE.Vector3()),z=bx.getSize(new THREE.Vector3());
    g.scene.position.sub(c);const d=Math.max(z.x,z.y,z.z)*2.2;
    cam.position.set(d*0.8,d*0.6,d*0.8);cam.lookAt(0,0,0);cam.far=d*10;cam.updateProjectionMatrix();
    renderer.render(scene,cam);
    document.getElementById(id).src=work.toDataURL();
    scene.remove(g.scene);
    setTimeout(next,50);
  },undefined,()=>{document.getElementById(id).alt='LOAD FAIL';setTimeout(next,50);});
}
next();
</script></body></html>
