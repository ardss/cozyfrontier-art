  #top{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;flex-wrap:wrap}
  #top .logo{font-size:15px;color:var(--gold);font-weight:700}
  .res{font-size:13px;background:#2b2420;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .res b{color:var(--gold)}
  #daybox{font-size:13px;color:var(--ok)}
  #selbox{font-size:12px;color:#cfe0ff;display:none}
  #body{flex:1;display:flex;min-height:0}
  #side{width:240px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  #side h3{font-size:13px;color:var(--gold);padding:10px 12px 4px}
  #cats{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px}
  #cats button{background:#2b2420;color:var(--dim);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer}
  #cats button.on{color:var(--gold);border-color:var(--gold)}
  #list{flex:1;overflow-y:auto;padding:4px 8px}
  .b{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
  .b:hover{background:#463a2e}
  .b.sel{border-color:var(--gold);background:#4a3d2c}
  .b.poor{opacity:.45}
  .b img{width:34px;height:34px;border-radius:6px;background:#efe9da;object-fit:contain;flex-shrink:0;pointer-events:none}
  .b .tx{pointer-events:none;flex:1}
  .b .nm{font-size:12px}
  .b .cost{font-size:10px;color:var(--dim)}
  #vlist{padding:6px 12px 10px;font-size:11px;color:var(--dim);line-height:1.9;max-height:150px;overflow-y:auto;border-top:1px solid var(--line)}
  #vlist .v{display:flex;justify-content:space-between;cursor:pointer;border-radius:4px;padding:0 4px}
  #vlist .v:hover{background:#463a2e}
  #vlist .v.sel{background:#4a5a6a;color:#fff}
  #main{flex:1;position:relative;min-width:0}
  #main canvas{display:block;outline:none;touch-action:none}
  #tip{position:absolute;pointer-events:none;background:rgba(43,36,32,.96);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.6;max-width:250px;display:none;z-index:6}
  #tip b{color:var(--gold)}
  #info{position:absolute;right:12px;top:12px;width:240px;background:rgba(58,49,40,.97);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.7;display:none;z-index:6}
  #info b{color:var(--gold);font-size:14px}
  #info button{margin:8px 6px 0 0;background:#8a4a3a;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
  #selrect{position:absolute;border:1px solid #8fc0ff;background:rgba(140,190,255,.15);display:none;z-index:7;pointer-events:none}
  #toast{position:absolute;left:50%;transform:translateX(-50%);top:14px;display:flex;flex-direction:column;gap:6px;z-index:8;pointer-events:none;align-items:center}
  .toast{background:rgba(43,36,32,.95);border:1px solid var(--gold);border-radius:10px;padding:8px 16px;font-size:13px;animation:tfade 4s forwards}
  @keyframes tfade{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #end{position:absolute;inset:0;background:rgba(30,24,20,.9);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #end h2{font-size:26px;color:var(--gold)}
  #end p{color:var(--dim);max-width:420px;text-align:center;line-height:1.8}
  #end button{background:#5a8a4a;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer}
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
  #zoom button{width:32px;height:32px;background:rgba(58,49,40,.95);color:var(--gold);border:1px solid var(--line);border-radius:8px;font-size:15px;cursor:pointer}
  #help{position:absolute;left:12px;top:12px;z-index:5;background:rgba(43,36,32,.92);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--dim);line-height:1.8}
  #help b{color:#cbb894}
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ============ 数值 ============ */
const DAY_SECONDS = 50, WINTER_DAY = 8, END_DAY = 11;
const SEASONS = d => d < 4 ? '秋' : d < WINTER_DAY ? '深秋' : d < END_DAY ? '冬 ❄' : '春';
const TREE_WOOD = 4, TREE_HP = 3;      // 每棵树砍 3 斧，共得 4×3=12 木？过强 → 树总产 6 木
const TREE_YIELD = 2;                   // 每斧 +2 木
const BUSH_FOOD = 3;                    // 每次采 +3 食
const WORK_RATE = 2.2;                  // 每斧/采集耗时秒
const DEFS = [
 {id:'hut',name:'窝棚',w:2,d:2,cat:'住房',cost:{wood:4},role:'house',cap:2,desc:'最便宜的容身之所。'},
 {id:'cottage_a',name:'村舍',w:2,d:2,cat:'住房',cost:{wood:5},role:'house',cap:2,desc:'双人小屋。'},
 {id:'cottage_b',name:'猎户村舍',w:2,d:2,cat:'住房',cost:{wood:5},role:'house',cap:2,desc:'双人小屋。'},
 {id:'home_small',name:'小民居',w:2,d:2,cat:'住房',cost:{wood:7},role:'house',cap:3,desc:'三人民居。'},
 {id:'farmhouse',name:'农舍',w:3,d:2,cat:'住房',cost:{wood:9},role:'house',cap:3,desc:'三人农舍。'},
 {id:'home_large',name:'大民居',w:3,d:2,cat:'住房',cost:{wood:13},role:'house',cap:4,desc:'四人宅邸。'},
 {id:'sawmill',name:'锯木厂',w:3,d:2,cat:'生产',cost:{wood:6},role:'wood',out:4,desc:'派村民上工：稳定产木（比砍树省心）。'},
 {id:'apiary',name:'蜂箱架',w:1,d:1,cat:'生产',cost:{wood:3},role:'food',out:2,desc:'派村民照看：产蜂蜜。'},
 {id:'bakery',name:'面包房',w:2,d:2,cat:'生产',cost:{wood:8},role:'food',out:3,desc:'派村民烤面包产食。'},
 {id:'greenhouse',name:'温室',w:2,d:2,cat:'生产',cost:{wood:10},role:'food',out:4,desc:'冬季不停产。'},
 {id:'granary',name:'粮仓',w:2,d:3,cat:'设施',cost:{wood:5},role:'granary',desc:'食物上限 +25。'},
 {id:'well',name:'水井',w:1,d:1,cat:'设施',cost:{wood:3},role:'well',desc:'住房 6 格内无井 → 村民效率减半。'},
 {id:'marketstall',name:'市集',w:2,d:1,cat:'设施',cost:{wood:5},role:'market',desc:'详情面板 4 木换 5 食。'},
 {id:'fountain',name:'喷泉',w:2,d:2,cat:'设施',cost:{wood:8},role:'happy',add:10,desc:'快乐 +10。'},
 {id:'brewery',name:'酿酒厂',w:3,d:2,cat:'设施',cost:{wood:9},role:'happy',add:15,desc:'快乐 +15。'},
 {id:'watchtower',name:'瞭望塔',w:2,d:2,cat:'设施',cost:{wood:7},role:'tower',desc:'夜间防狼。'},
 {id:'bridge',name:'石桥',w:3,d:1,cat:'装饰',cost:{wood:2},role:'deco',desc:'装饰。'},
 {id:'tollgate',name:'关卡',w:3,d:1,cat:'装饰',cost:{wood:2},role:'deco',desc:'装饰。'},
 {id:'stable',name:'马厩',w:3,d:2,cat:'装饰',cost:{wood:6},role:'deco',desc:'装饰。'},
 {id:'lighthouse',name:'灯塔',w:2,d:2,cat:'装饰',cost:{wood:6},role:'deco',desc:'装饰。'},
 {id:'bathhouse',name:'澡堂',w:2,d:2,cat:'装饰',cost:{wood:8},role:'deco',desc:'装饰。'},
 {id:'school',name:'学堂',w:2,d:2,cat:'装饰',cost:{wood:8},role:'deco',desc:'装饰。'},
 {id:'clinic',name:'诊所',w:2,d:2,cat:'装饰',cost:{wood:8},role:'deco',desc:'装饰。'},
 {id:'dovecote',name:'鸽房',w:1,d:1,cat:'装饰',cost:{wood:2},role:'deco',desc:'装饰。'},
 {id:'laundry',name:'晾晒场',w:2,d:1,cat:'装饰',cost:{wood:2},role:'deco',desc:'装饰。'},
 {id:'shipyard',name:'造船厂',w:4,d:3,cat:'装饰',cost:{wood:12},role:'deco',desc:'装饰。'},
 {id:'warehouse',name:'仓库',w:3,d:2,cat:'装饰',cost:{wood:7},role:'deco',desc:'装饰。'},
 {id:'watchpost',name:'哨位',w:2,d:2,cat:'装饰',cost:{wood:4},role:'deco',desc:'装饰。'},
];
DEFS.forEach(d => d.glb = 'ai3d-mirror/wc-' + d.id + '-paint.glb');
// 自产小物件（prop 管线），作为可建造装饰
[
  { id:'fence',    name:'木栅栏', w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'围出你的院子。' },
  { id:'barrel',   name:'木桶',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'装点什么好呢。' },
  { id:'crate',    name:'木箱',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'结实的储物箱。' },
  { id:'lantern',  name:'灯笼',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'夜晚的暖光。' },
  { id:'signpost', name:'路牌',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'指向家的方向。' },
  { id:'campfire', name:'篝火',   w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'聚会的中心。' },
  { id:'haystack', name:'草垛',   w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'秋收的气息。' },
  { id:'cart',     name:'手推车', w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'运货好帮手。' },
].forEach(p => { p.glb = 'ai3d-mirror/prop-' + p.id + '.glb'; DEFS.push(p); });
// 纯装饰散布（无碰撞，不占格）
const SCATTER_DEFS = {
  flowers:    'ai3d-mirror/prop-flowers.glb',
  grass_tuft: 'ai3d-mirror/prop-grass_tuft.glb',
  mushrooms:  'ai3d-mirror/prop-mushrooms.glb',
  rocks_small:'ai3d-mirror/prop-rocks_small.glb',
  rock_big:   'ai3d-mirror/prop-rock_big.glb',
  stump:      'ai3d-mirror/prop-stump.glb',
};
const NATURE_DEFS = {
  tree: { glb: 'ai3d-mirror/prop-tree_oak.glb', name: '橡树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  tree2:{ glb: 'ai3d-mirror/prop-tree_pine.glb', name: '松树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  tree3:{ glb: 'ai3d-mirror/prop-tree_blossom.glb', name: '花树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  dead: { glb: 'ai3d-mirror/prop-tree_dead.glb', name: '枯木', yield: 'wood', amt: 2, hp: 2, work: WORK_RATE },
  bush: { glb: 'ai3d-mirror/prop-berry_bush.glb', name: '浆果丛', yield: 'food', amt: BUSH_FOOD, hp: 3, work: WORK_RATE, regrow: 3 },
};

const GRID = 26, CELL = 1;
const enc = p => p.split('/').map(encodeURIComponent).join('/');

/* ============ 场景 ============ */
const mainEl = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMappingExposure = 1.3;
mainEl.appendChild(renderer.domElement);
const dom = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a96b);
scene.fog = new THREE.Fog(0x87a96b, 40, 95);
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.4);
sun.position.set(10, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, far: 60 });
scene.add(sun, new THREE.HemisphereLight(0xfff4e2, 0x6b8a4f, 1.05), new THREE.AmbientLight(0xffffff, 0.55));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GRID, GRID), new THREE.MeshLambertMaterial({ color: 0x8fae6a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const gridHelper = new THREE.GridHelper(GRID, GRID, 0x66824c, 0x7d9a5e);
gridHelper.position.y = 0.01; scene.add(gridHelper);

const camCtl = {
  target: new THREE.Vector3(GRID / 2, 0, GRID / 2), theta: Math.PI * 0.15, phi: Math.PI * 0.34, r: 26,
  apply() {
    cam.position.set(this.target.x + this.r * Math.sin(this.phi) * Math.cos(this.theta), this.r * Math.cos(this.phi), this.target.z + this.r * Math.sin(this.phi) * Math.sin(this.theta));
    cam.lookAt(this.target);
  },
  pan(dx, dz) {
    this.target.x = THREE.MathUtils.clamp(this.target.x + dx, -GRID * .3, GRID * 1.3);
    this.target.z = THREE.MathUtils.clamp(this.target.z + dz, -GRID * .3, GRID * 1.3);
    this.apply();
  },
  fwd() { return new THREE.Vector3(-Math.cos(this.theta), 0, -Math.sin(this.theta)); },
  right() { return new THREE.Vector3(Math.sin(this.theta), 0, -Math.cos(this.theta)); },
};

/* ============ 状态 ============ */
const G = {
  res: { wood: 10, food: 10 }, foodCap: 30, happy: 70,
  day: 1, time: 0, over: false,
  placed: [], occ: new Map(), villagers: [], nature: [],
  selected: new Set(),
};
const key = (x, z) => x + ',' + z;
const S = { mode: 'idle', sel: null, rot: 0, cell: { x: 0, z: 0 }, moving: null, hovered: null, downAt: null, boxStart: null };
const keys = {};
function footprint(b, rot) { return (rot % 2) ? [b.d, b.w] : [b.w, b.d]; }
function cellsOf(b, x, z, rot) {
  const [w, d] = footprint(b, rot), out = [];
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) out.push(key(x + i, z + j));
  return out;
}
function canPlace(b, x, z, rot, ignore) {
  const [w, d] = footprint(b, rot);
  if (x < 0 || z < 0 || x + w > GRID || z + d > GRID) return false;
  return cellsOf(b, x, z, rot).every(k => !G.occ.has(k) || G.occ.get(k) === ignore);
}
function clampCell(b, x, z, rot) {
  const [w, d] = footprint(b, rot);
  return { x: THREE.MathUtils.clamp(x, 0, GRID - w), z: THREE.MathUtils.clamp(z, 0, GRID - d) };
}
const canAfford = def => Object.entries(def.cost).every(([r, v]) => G.res[r] >= v);
const pay = def => Object.entries(def.cost).forEach(([r, v]) => G.res[r] -= v);

/* ============ 加载 ============ */
const protos = {};
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
let pend = DEFS.length + Object.keys(NATURE_DEFS).length + Object.keys(SCATTER_DEFS).length + 3;
function done1() { if (--pend === 0) startGame(); }
DEFS.forEach(def => loader.load(enc(def.glb) + '?v=1', g => {
  const root = g.scene;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; if (o.material) o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.scale.setScalar(Math.min(def.w / size.x, def.d / size.z, Math.max(def.w, def.d) / Math.max(size.x, size.z)));
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -box2.min.y, -c.z);
  const wrap = new THREE.Group(); wrap.add(root);
  protos[def.id] = wrap; done1();
}));
Object.entries(NATURE_DEFS).forEach(([id, nd]) => loader.load(enc(nd.glb) + '?v=1', g => {
  const root = g.scene;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; if (o.material) o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.scale.setScalar(1.15 / Math.max(size.x, size.z));
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -box2.min.y, -c.z);
  const wrap = new THREE.Group(); wrap.add(root);
  protos['nat_' + id] = wrap; done1();
}));
Object.entries(SCATTER_DEFS).forEach(([id, glb]) => loader.load(enc(glb) + '?v=1', g => {
  const root = g.scene;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; if (o.material) o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.scale.setScalar(0.55 / Math.max(size.x, size.z));
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -box2.min.y, -c.z);
  const wrap = new THREE.Group(); wrap.add(root);
  protos['deco_' + id] = wrap; done1();
}));
const CHAR_FILES = ['prop-villager_m.glb', 'prop-villager_f.glb', 'prop-villager_old.glb'];
const VNAMES = ['阿岚', '小满', '石头', '阿枣', '春妮', '大川', '阿槐', '小蝶'];
CHAR_FILES.forEach((f, i) => loader.load(enc('ai3d-mirror/' + f) + '?v=1', g => {
  const root = g.scene;
  root.traverse(o => { if (o.isMesh && o.material) { o.material.side = THREE.DoubleSide; o.castShadow = true; } });
  protos['char' + i] = root; done1();
}));

/* ============ 自然资源 ============ */
function scatterNature() {
  const center = GRID / 2;
  let tries = 0;
  const want = { tree: 22, tree2: 8, tree3: 6, dead: 4, bush: 14 };
  for (const [type, n] of Object.entries(want)) {
    let placedN = 0;
    while (placedN < n && tries++ < 800) {
      const x = 1 + Math.floor(Math.random() * (GRID - 2));
      const z = 1 + Math.floor(Math.random() * (GRID - 2));
      if (G.occ.has(key(x, z))) continue;
      const dc = Math.hypot(x - center, z - center);
      if (dc < 3.5) continue;   // 中心留空地给村庄
      if (type !== 'bush' && dc > 4 && dc < 5.2 && Math.random() < .7) continue; // 别围死中心
      const nd = NATURE_DEFS[type];
      const inst = protos['nat_' + type].clone();
      const jitter = .25;
      inst.position.set(x + .5 + (Math.random() - .5) * jitter, 0, z + .5 + (Math.random() - .5) * jitter);
      inst.rotation.y = Math.random() * Math.PI * 2;
      const s = .8 + Math.random() * .45; inst.scale.setScalar(s);
      scene.add(inst);
      const node = { type, def: nd, inst, x, z, hp: nd.hp, alive: true, respawnDay: 0 };
      G.nature.push(node);

  }
}
function scatterDeco() {
  // 纯装饰小物：不占格、无碰撞，贴边与林间随机点缀
  const want = { grass_tuft: 26, flowers: 16, mushrooms: 10, rocks_small: 12, rock_big: 5, stump: 6 };

      if (G.occ.has(key(Math.floor(x), Math.floor(z)))) continue;
      const inst = protos['deco_' + type].clone();

}
function chopDone(node) {

    scene.remove(node.inst);
    if (G.occ.get(key(node.x, node.z)) === node) G.occ.delete(key(node.x, node.z));
    node.respawnDay = G.day + (node.def.regrow || 9999);

}
function regrow() {

}

function spawnVillagers(n) {
  for (let i = 0; i < n; i++) {
    const proto = protos['char' + (G.villagers.length % CHAR_FILES.length)];
    const root = proto.clone();
    const wrap = new THREE.Group();
    // 关键：先把 clone 摆正（原点=脚底中心），再给 wrap 统一缩放
    const box = new THREE.Box3().setFromObject(root);
    const h = box.max.y - box.min.y;
    wrap.scale.setScalar(0.8 / h);
    wrap.add(root);
    const box2 = new THREE.Box3().setFromObject(wrap);
    const c = box2.getCenter(new THREE.Vector3());
    root.position.sub(new THREE.Vector3(c.x, box2.min.y, c.z));
    wrap.position.set(GRID / 2 + (Math.random() - .5) * 3, 0, GRID / 2 + (Math.random() - .5) * 3);
    // 选中圈
    const ring = new THREE.Mesh(new THREE.RingGeometry(.28, .36, 24).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x8fc0ff, transparent: true, opacity: .9, depthWrite: false }));
    ring.position.y = .02; ring.visible = false;
    wrap.add(ring);
    scene.add(wrap);
    G.villagers.push({
      name: VNAMES[G.villagers.length % VNAMES.length], obj: wrap, root, ring,
      task: null, // {kind:'move'|'chop'|'work', target, workT}
      walkT: 0,
    });
  }
}
function command(v, kind, target) {
  v.task = { kind, target, workT: 0 };
}
function stepVillager(v, dt, t) {
  const speed = 1.5;
  let dest = null, arriveR = .6;
  if (v.task) {
    if (v.task.kind === 'move') { dest = v.task.target; arriveR = .25; }
    else if (v.task.kind === 'chop') {
      if (!v.task.target.alive) { v.task = null; return; }
      dest = v.task.target.inst.position; arriveR = 1.15;
    } else if (v.task.kind === 'work') {
      if (!G.placed.includes(v.task.target)) { v.task = null; return; }
      dest = v.task.target.inst.position; arriveR = 1.3;
    }
  }
  if (dest) {
    const dx = dest.x - v.obj.position.x, dz = dest.z - v.obj.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > arriveR) {
      const nx = v.obj.position.x + dx / dist * speed * dt;
      const nz = v.obj.position.z + dz / dist * speed * dt;
      const blocker = G.occ.get(key(Math.floor(nx), Math.floor(nz)));
      // 建筑挡路就绕（简单 sidestep），自然资源可穿
      if (blocker && blocker.inst && G.placed.includes(blocker)) {
        v.obj.position.x += dz / dist * speed * dt * (v._side || (v._side = Math.random() < .5 ? 1 : -1));
      } else { v.obj.position.x = nx; v.obj.position.z = nz; v._side = 0; }
      v.obj.rotation.y = Math.atan2(dx, dz);
      v.root.position.y = Math.abs(Math.sin(t * 10)) * .05;
      return;
    }
    // 到岗：干活
    if (v.task.kind === 'move') { v.task = null; return; }
    v.task.workT += dt;
    // 干活摆动
    v.root.rotation.x = Math.sin(t * 12) * .12;
    if (v.task.workT >= v.task.target.def.work) {
      v.task.workT = 0;
      if (v.task.kind === 'chop') {
        const node = v.task.target;
        G.res[v.task.target.def.yield] = Math.min(v.task.target.def.yield === 'food' ? G.foodCap : 9999, G.res[v.task.target.def.yield] + v.task.target.def.amt);
        chopDone(node);
      } else if (v.task.kind === 'work') {
        // 建筑产出走天结算，这里只算出勤
      }
    }
  } else {
    v.root.rotation.x = 0;
    v.root.position.y = 0;
  }
}

const matPad = new THREE.MeshLambertMaterial({ color: 0x9db972 });
const matPadEdge = new THREE.MeshLambertMaterial({ color: 0x8fae63 });
const padGeo = new THREE.PlaneGeometry(0.98, 0.98).rotateX(-Math.PI / 2);
const SINK = 0.045;
function makePad(b, rot) {
  const g = new THREE.Group(); const [w, d] = footprint(b, rot);
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) {
    const p = new THREE.Mesh(padGeo, (i === 0 || j === 0 || i === w - 1 || j === d - 1) ? matPadEdge : matPad);
    p.position.set(i + .5, 0.006, j + .5); p.receiveShadow = true; g.add(p);
  }
  return g;
}
const anims = [];
function dropAnim(inst) { inst.userData.anim = { t: 0, fromY: 1.1 }; anims.push(inst); }
function stepAnims(dt) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const inst = anims[i], a = inst.userData.anim;
    a.t = Math.min(1, a.t + dt * 5);
    inst.position.y = (inst.userData.baseY || 0) + (a.fromY - (inst.userData.baseY || 0)) * (1 - Math.pow(1 - a.t, 3));
    if (a.t >= 1) { inst.position.y = inst.userData.baseY || 0; anims.splice(i, 1); }
  }
}
function placeInstance(def, x, z, rot, animate) {
  const pad = makePad(def, rot); pad.position.set(x, 0, z); scene.add(pad);
  const inst = protos[def.id].clone();
  const [w, d] = footprint(def, rot);
  inst.position.set(x + w / 2, SINK, z + d / 2);
  inst.rotation.y = rot * Math.PI / 2;
  inst.userData.baseY = SINK;
  scene.add(inst);
  const entry = { def, inst, pad, x, z, rot, workers: [] };
  cellsOf(def, x, z, rot).forEach(k => G.occ.set(k, entry));
  G.placed.push(entry);
  if (animate) dropAnim(inst);
  if (def.role === 'happy') G.happy += def.add;
  if (def.role === 'granary') G.foodCap += 25;
  return entry;
}
function removeEntry(entry) {
  cellsOf(entry.def, entry.x, entry.z, entry.rot).forEach(k => { if (G.occ.get(k) === entry) G.occ.delete(k); });
  scene.remove(entry.inst, entry.pad);
  G.placed = G.placed.filter(p => p !== entry);
  G.villagers.forEach(v => { if (v.task && v.task.target === entry) v.task = null; });
  if (entry.def.role === 'happy') G.happy -= entry.def.add;
  if (entry.def.role === 'granary') G.foodCap -= 25;

}

const matOK = new THREE.MeshBasicMaterial({ color: 0xaaffaa, transparent: true, opacity: .5, depthWrite: false });
const matNO = new THREE.MeshBasicMaterial({ color: 0xff6655, transparent: true, opacity: .5, depthWrite: false });
const ghost = { grp: null, fp: null };
const fpUnit = new THREE.PlaneGeometry(0.96, 0.96).rotateX(-Math.PI / 2);
function buildGhost() {
  killGhost();
  if (!S.sel || !protos[S.sel.id]) return;
  ghost.grp = protos[S.sel.id].clone();
  ghost.grp.traverse(o => { if (o.isMesh) o.material = matOK; });
  ghost.fp = new THREE.Group();
  scene.add(ghost.grp, ghost.fp);

}
function killGhost() { if (ghost.grp) scene.remove(ghost.grp); if (ghost.fp) scene.remove(ghost.fp); ghost.grp = ghost.fp = null; }
function updateGhost() {
  if (!S.sel) return;
  const def = S.sel, { x, z } = S.cell, rot = S.rot;
  const [w, d] = footprint(def, rot);
  const ok = canPlace(def, x, z, rot) && canAfford(def);
  if (ghost.grp) {
    ghost.grp.traverse(o => { if (o.isMesh) o.material = ok ? matOK : matNO; });
    ghost.grp.position.set(x + w / 2, SINK + .02, z + d / 2);
    ghost.grp.rotation.y = rot * Math.PI / 2;

  if (ghost.fp) {

/* ============ 拾取 ============ */
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function toGround(e) {
  const r = dom.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, cam);
  const pt = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, pt) ? pt : null;
}
function pickAt(e, list, filterAlive) {
  const r = dom.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, cam);
  const objs = list.map(p => p.inst || p.obj);
  const hits = raycaster.intersectObjects(objs, true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      const found = list.find(p => (p.inst || p.obj) === o);
      if (found && (!filterAlive || found.alive !== false)) return found;
      o = o.parent;
    }
  }
  return null;
}

/* ============ 经济与日程 ============ */
function capacity() { return G.placed.filter(p => p.def.role === 'house').reduce((s, p) => s + p.def.cap, 0); }
function houseHappiness() {
  const houses = G.placed.filter(p => p.def.role === 'house');
  const good = houses.filter(p => G.placed.some(w => w.def.role === 'well' && Math.abs(w.x - p.x) <= 6 && Math.abs(w.z - p.z) <= 6)).reduce((s, p) => s + p.def.cap, 0);
  const total = houses.reduce((s, p) => s + p.def.cap, 0);
  return total ? good / total : 1;
}
function productionPerDay() {
  let wood = 0, food = 0;
  const eff = (0.6 + G.happy / 250) * (0.5 + 0.5 * houseHappiness());
  const winter = G.day >= WINTER_DAY;
  for (const p of G.placed) {
    if (p.def.role !== 'wood' && p.def.role !== 'food') continue;
    const n = G.villagers.filter(v => v.task && v.task.kind === 'work' && v.task.target === p).length;
    if (!n) continue;
    const rate = winter && p.def.id !== 'greenhouse' ? 0.3 : 1;
    if (p.def.role === 'wood') wood += p.def.out * Math.min(n, 2) * eff;
    else food += p.def.out * Math.min(n, 2) * eff * rate;
  }
  return { wood, food };
}
function night() {
  const need = G.villagers.length;
  if (G.res.food >= need) G.res.food -= need;
  else {
    G.res.food = 0; G.happy -= 15;
    const leaver = G.villagers.pop();
    if (leaver) { scene.remove(leaver.obj); G.selected.delete(leaver); toast(`😢 ${leaver.name} 饿坏了，离开了村庄`); }
  }
  if (G.day >= WINTER_DAY) G.happy -= 6; else G.happy = Math.min(100, G.happy + 4);
  const roll = Math.random();
  if (roll < 0.22 && G.day >= 3) {
    if (!G.placed.some(p => p.def.role === 'tower')) {
      const loss = Math.min(G.res.food, 4 + Math.floor(Math.random() * 4));
      G.res.food -= loss;
      toast(`🐺 狼群偷粮！损失 ${loss} 食（建瞭望塔可防）`);
    } else toast('🐺 狼群被瞭望塔吓退了');
  } else if (roll < 0.4 && capacity() > G.villagers.length && G.res.food >= G.villagers.length) {
    spawnVillagers(1); toast(`🎉 旅行者加入村庄（现 ${G.villagers.length} 人）`);
  } else if (roll < 0.5) { G.res.wood += 3; toast('🌊 河水送来浮木 +3 木'); }
  G.happy = Math.max(0, G.happy);
  G.day++; regrow();
  if (G.day === WINTER_DAY) toast('❄ 冬天来了！露天产出大减，温室/囤粮是关键');
  if (G.day >= END_DAY) { endGame(); return; }
  refreshUI();
}
function endGame() {
  G.over = true;
  const pop = G.villagers.length;
  document.getElementById('end').style.display = 'flex';
  if (pop >= 3) {
    document.getElementById('end-title').textContent = '🌸 春天来了——活过了冬天！';
    document.getElementById('end-desc').textContent = `最终人口 ${pop}，余粮 ${Math.floor(G.res.food)}，快乐 ${Math.round(G.happy)}。闭环成立：选人→派工→采集→建造→备冬。`;
  } else {
    document.getElementById('end-title').textContent = '❄ 村庄没能撑过冬天';
    document.getElementById('end-desc').textContent = `春天只剩 ${pop} 人（需 ≥3）。多囤粮、早建温室、盯紧快乐。`;
  }
}

  const workers = G.villagers.filter(v => v.task && v.task.target === entry).length;
  const trade = d.role === 'market' && G.res.wood >= 4 ? '<br><button onclick="__trade()">4 木换 5 食</button>' : '';
  el.innerHTML = `<b>${d.name}</b><br><span style="color:#a89880;font-size:11px">${d.cat} · ${d.w}×${d.d}</span><br>${d.desc}<br>在岗：${workers} 人${trade}<button onclick="__del()">拆除</button>`;
}
window.__trade = () => { if (G.res.wood >= 4) { G.res.wood -= 4; G.res.food = Math.min(G.foodCap, G.res.food + 5); toast('🛒 -4 木 +5 食'); refreshUI(); } };
window.__del = () => { if (window.__cur) removeEntry(window.__cur); document.getElementById('info').style.display = 'none'; };

/* ============ 交互 ============ */
function startPlacing(def) {
  S.sel = def; S.rot = 0; S.mode = 'placing';
  document.querySelectorAll('.b').forEach(e => e.classList.remove('sel'));
  document.getElementById('b-' + def.id).classList.add('sel');
  buildGhost(); dom.style.cursor = 'copy';
}
function stopPlacing() {
  S.sel = null; S.mode = 'idle';
  document.querySelectorAll('.b').forEach(e => e.classList.remove('sel'));
  killGhost(); dom.style.cursor = 'default';
}
const DRAG_T = 5;
const selrect = document.getElementById('selrect');
addEventListener('pointerdown', e => {
  if (e.target !== dom || G.over) return;
  S.downAt = { x: e.clientX, y: e.clientY };
  try { dom.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.button === 2) return;              // 右键在 up 时发指令
  if (e.button === 1) { S.mode = 'panning'; e.preventDefault(); return; }
  if (e.button !== 0) return;
  if (S.mode === 'placing') return;
  // 左键：先记 down，up 时区分 点选/框选/点建筑
  S.mode = 'maybeSelect';
});
addEventListener('pointermove', e => {
  if (G.over) return;
  const over = (() => { const r = dom.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; })();
  // 框选绘制
  if (S.mode === 'maybeSelect' && S.downAt && (Math.abs(e.clientX - S.downAt.x) > DRAG_T || Math.abs(e.clientY - S.downAt.y) > DRAG_T)) {
    S.mode = 'boxSelect';
  }
  if (S.mode === 'boxSelect') {
    const m = mainEl.getBoundingClientRect();
    const x1 = Math.min(S.downAt.x, e.clientX) - m.left, y1 = Math.min(S.downAt.y, e.clientY) - m.top;
    const x2 = Math.max(S.downAt.x, e.clientX) - m.left, y2 = Math.max(S.downAt.y, e.clientY) - m.top;
    selrect.style.display = 'block';
    selrect.style.left = x1 + 'px'; selrect.style.top = y1 + 'px';
    selrect.style.width = (x2 - x1) + 'px'; selrect.style.height = (y2 - y1) + 'px';
    return;
  }
  if (S.mode === 'movingBuilding' && S.moving) {
    const pt = toGround(e);
    if (pt) {
      S.cell = clampCell(S.moving.def, Math.floor(pt.x), Math.floor(pt.z), S.rot);
      const [w, d] = footprint(S.moving.def, S.rot);
      S.moving.inst.position.set(S.cell.x + w / 2, .05, S.cell.z + d / 2);
      S.moving.inst.rotation.y = S.rot * Math.PI / 2;
      const ok = canPlace(S.moving.def, S.cell.x, S.cell.z, S.rot);
      S.moving.inst.traverse(o => { if (o.isMesh) o.material = ok ? matOK : matNO; });
      S.moving.valid = ok;
    }
    return;
  }
  if (S.mode === 'placing') {
    if (over) {
      const pt = toGround(e);
      if (pt && S.sel) { S.cell = clampCell(S.sel, Math.floor(pt.x), Math.floor(pt.z), S.rot); updateGhost(); }
    }
    return;
  }
  if (S.mode === 'panning') {
    if (e.movementX || e.movementY) {
      const sp = camCtl.r * .0016, f = camCtl.fwd(), r = camCtl.right();
      camCtl.pan(-e.movementX * sp * r.x + e.movementY * sp * f.x, -e.movementX * sp * r.z + e.movementY * sp * f.z);
    }
    return;
  }
  // idle 悬停提示
  if (S.mode === 'idle' && over) {
    const tip = document.getElementById('tip');
    const nat = pickAt(e, G.nature, true);
    const bld = nat ? null : pickAt(e, G.placed);
    const vil = (nat || bld) ? null : pickAt(e, G.villagers);
    if (nat || bld || vil) {
      const m = mainEl.getBoundingClientRect();
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX - m.left + 14, m.width - 260) + 'px';
      tip.style.top = Math.min(e.clientY - m.top + 10, m.height - 90) + 'px';
      if (nat) tip.innerHTML = `<b>${nat.def.name}</b><br>剩余 ${nat.hp} 次 · ${nat.def.yield === 'wood' ? '🪓' : '🍎'}+${nat.def.amt}/次<br><span style="color:#a89880">选村民后右键派工</span>`;
      else if (bld) tip.innerHTML = `<b>${bld.def.name}</b><br>${bld.def.desc}`;
      else tip.innerHTML = `<b>${vil.name}</b><br>${vil.task ? '忙' : '待命'} · 点击选中`;
      return;
    }
    tip.style.display = 'none';
  }
});
addEventListener('pointerup', e => {
  if (G.over) return;
  selrect.style.display = 'none';
  const wasClick = S.downAt && Math.abs(e.clientX - S.downAt.x) < DRAG_T && Math.abs(e.clientY - S.downAt.y) < DRAG_T;
  if (e.button === 2) {
    // 右键 = 指令（有选中村民时），否则无操作
    if (G.selected.size) commandAt(e);
    S.mode = S.sel ? 'placing' : 'idle'; S.downAt = null;
    return;
  }
  if (S.mode === 'boxSelect') {
    // 屏幕矩形 → 选中范围内村民
    const r = dom.getBoundingClientRect();
    const m = mainEl.getBoundingClientRect();
    const x1 = Math.min(S.downAt.x, e.clientX), x2 = Math.max(S.downAt.x, e.clientX);
    const y1 = Math.min(S.downAt.y, e.clientY), y2 = Math.max(S.downAt.y, e.clientY);
    clearSel();
    const p = new THREE.Vector3();
    for (const v of G.villagers) {
      p.copy(v.obj.position); p.y = .5; p.project(cam);
      const sx = r.left + (p.x + 1) / 2 * r.width, sy = r.top + (1 - p.y) / 2 * r.height;
      if (sx >= x1 && sx <= x2 && sy >= y1 && sy <= y2) { G.selected.add(v); v.ring.visible = true; }
    }
    selUI();
    if (G.selected.size) toast('已选中 ' + G.selected.size + ' 人，右键派活');
  } else if (S.mode === 'maybeSelect' && wasClick && e.button === 0) {
    const vil = pickAt(e, G.villagers);
    if (vil) {
      if (e.shiftKey) { G.selected.has(vil) ? (G.selected.delete(vil), vil.ring.visible = false) : (G.selected.add(vil), vil.ring.visible = true); selUI(); }
      else { clearSel(); G.selected.add(vil); vil.ring.visible = true; selUI(); }
    } else {
      const bld = pickAt(e, G.placed);
      if (bld) { clearSel(); showInfo(bld); }
      else { clearSel(); document.getElementById('info').style.display = 'none'; }
    }
  } else if (S.mode === 'placing' && wasClick && e.button === 0 && S.sel) {
    if (canPlace(S.sel, S.cell.x, S.cell.z, S.rot) && canAfford(S.sel)) {
      pay(S.sel);
      placeInstance(S.sel, S.cell.x, S.cell.z, S.rot, true);
      toast('🔨 ' + S.sel.name + ' 建成');
      stopPlacing(); refreshUI();
    }
  }
  S.mode = S.sel ? 'placing' : 'idle';
  S.downAt = null;
});
addEventListener('dragstart', e => e.preventDefault());
dom.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { stopPlacing(); clearSel(); document.getElementById('info').style.display = 'none'; return; }
  if (['w','a','s','d','q','e','r'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 'r' && S.sel) { S.rot = (S.rot + 1) % 4; S.cell = clampCell(S.sel, S.cell.x, S.cell.z, S.rot); updateGhost(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function camKeys() {
  const sp = camCtl.r * .02, f = camCtl.fwd(), r = camCtl.right();
  if (keys.w) camCtl.pan(f.x * sp, f.z * sp);
  if (keys.s) camCtl.pan(-f.x * sp, -f.z * sp);
  if (keys.d) camCtl.pan(r.x * sp, r.z * sp);
  if (keys.a) camCtl.pan(-r.x * sp, -r.z * sp);
  if (keys.q) { camCtl.theta += .03; camCtl.apply(); }
  if (keys.e) { camCtl.theta -= .03; camCtl.apply(); }
}
dom.addEventListener('wheel', e => {
  e.preventDefault();
  camCtl.r = THREE.MathUtils.clamp(camCtl.r + e.deltaY * .02, 7, 55); camCtl.apply();
}, { passive: false });
document.getElementById('zin').onclick = () => { camCtl.r = Math.max(7, camCtl.r - 4); camCtl.apply(); };
document.getElementById('zout').onclick = () => { camCtl.r = Math.min(55, camCtl.r + 4); camCtl.apply(); };

/* ============ 启动与主循环 ============ */
function startGame() {
  scatterNature();
  scatterDeco();
  spawnVillagers(3);
  DEFS.forEach(queueThumb);
  refreshUI();
  toast('🍂 目标：活到第 10 天结束人口≥3。选村民（点/框选）→ 右键树/浆果丛派工');
}
function resize() {
  const w = mainEl.clientWidth, h = mainEl.clientHeight;
  renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
camCtl.apply(); resize();
window.__G = G; window.__THREE = THREE; window.__cam = cam;
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  if (!G.over) {
    G.time += dt;
    const p = productionPerDay();
    G.res.wood += p.wood * dt / DAY_SECONDS;
    G.res.food = Math.min(G.foodCap, G.res.food + p.food * dt / DAY_SECONDS);
    if (G.time >= DAY_SECONDS) { G.time = 0; night(); }
    for (const v of G.villagers) stepVillager(v, dt, t);
    if (Math.floor(t * 2) !== G._uiT) { G._uiT = Math.floor(t * 2); if (!G.over) refreshUI(); }
  }
  camKeys(); stepAnims(dt);
  renderer.render(scene, cam);
})();
</script>
</body>
