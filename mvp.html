const DEFS = [

  // 自产小物件（prop 管线）
  { id:'fence',    name:'木栅栏', w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'围出你的院子。' },
  { id:'barrel',   name:'木桶',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'装点什么好呢。' },
  { id:'crate',    name:'木箱',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'结实的储物箱。' },
  { id:'lantern',  name:'灯笼',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'夜晚的暖光。' },
  { id:'signpost', name:'路牌',   w:1,d:1, cat:'装饰', cost:{wood:1}, role:'deco', desc:'指向家的方向。' },
  { id:'campfire', name:'篝火',   w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'聚会的中心。' },
  { id:'haystack', name:'草垛',   w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'秋收的气息。' },
  { id:'cart',     name:'手推车', w:1,d:1, cat:'装饰', cost:{wood:2}, role:'deco', desc:'运货好帮手。' },

DEFS.forEach(d => d.glb = d.glb || `ai3d-mirror/wc-${d.id}-paint.glb`);
// 文件名与 id 不一致的特例
const wellDef = DEFS.find(d => d.id === 'wellhouse');
if (wellDef) wellDef.glb = 'ai3d-mirror/wc-well-paint.glb';
// 自产小物件改用 prop 管线的模型
['fence','barrel','crate','lantern','signpost','campfire','haystack','cart'].forEach(id => {
  const d = DEFS.find(x => x.id === id);
  if (d) d.glb = `ai3d-mirror/prop-${id}.glb`;
});

const NATURE_DEFS = {
  tree:  { glb: 'ai3d-mirror/prop-tree_oak.glb',  name: '橡树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  tree2: { glb: 'ai3d-mirror/prop-tree_pine.glb', name: '松树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  tree3: { glb: 'ai3d-mirror/prop-tree_blossom.glb', name: '花树', yield: 'wood', amt: TREE_YIELD, hp: TREE_HP, work: WORK_RATE },
  dead:  { glb: 'ai3d-mirror/prop-tree_dead.glb', name: '枯木', yield: 'wood', amt: 2, hp: 2, work: WORK_RATE },
  bush:  { glb: 'ai3d-mirror/prop-berry_bush.glb', name: '浆果丛', yield: 'food', amt: BUSH_FOOD, hp: 3, work: WORK_RATE, regrow: 3 },
  rocks: { glb: 'ai3d-mirror/prop-rocks_small.glb', name: '碎石堆', yield: 'stone', amt: 1, hp: 2, work: WORK_RATE },
  rock:  { glb: 'ai3d-mirror/prop-rock_big.glb', name: '巨石', yield: 'stone', amt: 2, hp: 3, work: WORK_RATE },
};
const SCATTER_DEFS = {
  flowers:    'ai3d-mirror/prop-flowers.glb',
  grass_tuft: 'ai3d-mirror/prop-grass_tuft.glb',
  mushrooms:  'ai3d-mirror/prop-mushrooms.glb',
  stump:      'ai3d-mirror/prop-stump.glb',
};
const SCATTER_COUNTS = { grass_tuft: 26, flowers: 16, mushrooms: 10, stump: 6 };
const NATURE_COUNTS  = { tree: 22, tree2: 8, tree3: 6, dead: 4, bush: 14, rocks: 8, rock: 5 };
const VNAMES = ['阿岚', '小满', '石头', '阿枣', '春妮', '大川', '阿槐', '小蝶'];
const CATS = ['全部', '住房', '生产', '设施', '装饰'];

/* =====================================================================
 * 2. 资产 —— 统一的 GLB 加载与原型规范化
 * ===================================================================*/
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const loader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(dracoLoader);

const protos = {};   // id -> 归一化的 Group（原点=脚印中心，脚底贴地）
let pendingLoads = 0, onAllLoaded = null;

function loadProto(id, glb, fit) {
  pendingLoads++;
  const done = () => { if (--pendingLoads === 0 && onAllLoaded) onAllLoaded(); };
  loader.load(enc(glb) + '?v=5', g => {
    const root = g.scene;
    root.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => {
        m.side = THREE.DoubleSide;
        // glTF 未写 metal/rough 时默认 metalness=1，无环境贴图会发灰发暗 → 强制非金属
        if (m.metalness !== undefined) { m.metalness = 0; m.roughness = 1; }
      });
    });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    root.scale.setScalar(fit(size));
    const box2 = new THREE.Box3().setFromObject(root);
    const c = box2.getCenter(new THREE.Vector3());
    root.position.set(-c.x, -box2.min.y, -c.z);
    const wrap = new THREE.Group();
    wrap.add(root);
    protos[id] = wrap;
    done();
  }, undefined, err => { console.error('load fail', glb, err); done(); });
}
// 建筑适配 w×d 脚印；自然物/散布物/村民适配目标尺寸
DEFS.forEach(d => loadProto(d.id, d.glb, s => Math.min(d.w / s.x, d.d / s.z)));   // 脚印贴齐即可，高度不压缩（避免房子被压扁）
Object.entries(NATURE_DEFS).forEach(([id, nd]) => loadProto('nat_' + id, nd.glb, s => 1.15 / Math.max(s.x, s.z)));
Object.entries(SCATTER_DEFS).forEach(([id, glb]) => loadProto('deco_' + id, glb, s => 0.55 / Math.max(s.x, s.z)));

/* ---- 村民：运行时人形骨骼绑定 ----
 * 静态网格 → 按顶点最近骨段分配蒙皮权重 → SkinnedMesh，走路/砍伐直接驱动骨头 */
const CHAR_FILES = ['prop-villager_m.glb', 'prop-villager_f.glb', 'prop-villager_old.glb'];
// 从顶点分布实测身体关键点（bbox 含离群点不可直接用）
function bodySegments(geo) {
  const pos = geo.getAttribute('position');
  const xs = [], ys = [], zs = [];
  const step = Math.max(1, Math.floor(pos.count / 800));
  for (let i = 0; i < pos.count; i += step) {
    xs.push(pos.getX(i)); ys.push(pos.getY(i)); zs.push(pos.getZ(i));
  }
  const pct = (arr, p) => { const a = [...arr].sort((m, n) => m - n); return a[Math.floor(a.length * p)]; };
  const med = arr => pct(arr, .5);
  const yLo = pct(ys, .02), yHi = pct(ys, .98), H = yHi - yLo;
  const cx = med(xs), cz = med(zs);
  const band = (y0, y1) => xs.filter((x, i) => ys[i] >= y0 && ys[i] <= y1).map(x => Math.abs(x - cx));
  const shoulderY = yLo + .74 * H, hipY = yLo + .5 * H;
  const armX = Math.max(...band(shoulderY - .06 * H, shoulderY)) || .1 * H;   // 肩带最宽处 = 手臂外沿
  const legX = Math.max(...band(yLo + .12 * H, hipY)) || .08 * H;             // 髋部以下最宽 = 腿间距
  const V = (x, y) => [x, y, cz];
  return [
    { name: 'legL', a: V(cx + legX * .6, hipY), b: V(cx + legX * .8, yLo) },
    { name: 'legR', a: V(cx - legX * .6, hipY), b: V(cx - legX * .8, yLo) },
    { name: 'spine', a: V(cx, hipY), b: V(cx, shoulderY) },
    { name: 'head', a: V(cx, shoulderY), b: V(cx, yHi + .02 * H) },
    { name: 'armL', a: V(cx + armX * .55, shoulderY), b: V(cx + armX * .95, shoulderY - .3 * H) },
    { name: 'armR', a: V(cx - armX * .55, shoulderY), b: V(cx - armX * .95, shoulderY - .3 * H) },
  ];
}
function pointSegDist(p, a, b) {
  const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const ap = [p.x - a[0], p.y - a[1], p.z - a[2]];
  const ab2 = ab[0] * ab[0] + ab[1] * ab[1] + ab[2] * ab[2];
  const t = Math.max(0, Math.min(1, (ap[0] * ab[0] + ap[1] * ab[1] + ap[2] * ab[2]) / ab2));
  const dx = ap[0] - ab[0] * t, dy = ap[1] - ab[1] * t, dz = ap[2] - ab[2] * t;
  return dx * dx + dy * dy + dz * dz;
}
CHAR_FILES.forEach((f, i) => {
  pendingLoads++;
  loader.load(enc('ai3d-mirror/' + f) + '?v=5', g => {
    const root = g.scene;
    const segs = bodySegments(root.children[0]?.geometry || g.scene.getObjectByProperty('isMesh', true).geometry);
    const geoList = [];
    root.traverse(o => {
      if (!o.isMesh || !o.geometry) return;
      const geo = o.geometry.clone();
      const pos = geo.getAttribute('position');
      const idx = new Uint16Array(pos.count * 4);
      const wgt = new Float32Array(pos.count * 4);
      for (let vi = 0; vi < pos.count; vi++) {
        const p = { x: pos.getX(vi), y: pos.getY(vi), z: pos.getZ(vi) };
        const ds = segs.map(s => pointSegDist(p, s.a, s.b));
        let b0 = 0, b1 = 1;
        if (ds[1] < ds[0]) { b0 = 1; b1 = 0; }
        for (let s = 2; s < ds.length; s++) {
          if (ds[s] < ds[b0]) { b1 = b0; b0 = s; }
          else if (ds[s] < ds[b1]) b1 = s;
        }
        // 距离反比双骨混合，避免接缝撕裂
        const w0 = ds[b1] / (ds[b0] + ds[b1] + 1e-6);
        idx[vi * 4] = b0; wgt[vi * 4] = w0;
        idx[vi * 4 + 1] = b1; wgt[vi * 4 + 1] = 1 - w0;
      }
      geo.setAttribute('skinIndex', new THREE.BufferAttribute(idx, 4));
      geo.setAttribute('skinWeight', new THREE.BufferAttribute(wgt, 4));
      geoList.push({ geo, material: o.material });
    });
    protos['char' + i] = { skin: { geoList, segs }, charFile: f };
    if (--pendingLoads === 0 && onAllLoaded) onAllLoaded();
  }, undefined, err => { console.error('load fail', f, err); if (--pendingLoads === 0 && onAllLoaded) onAllLoaded(); });
});

const key = (x, z) => x + ',' + z;
function footprint(b, rot) { return (rot % 2) ? [b.d, b.w] : [b.w, b.d]; }
function cellsOf(b, x, z, rot) {
  const [w, d] = footprint(b, rot), out = [];
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) out.push(key(x + i, z + j));
  return out;
}
function canPlace(b, x, z, rot, ignore) {
  const [w, d] = footprint(b, rot);
  if (x < 0 || z < 0 || x + w > GRID || z + d > GRID) return false;
  return cellsOf(b, x, z, rot).every(k => !G.occ.has(k) || G.occ.get(k) === ignore);
}
function clampCell(b, x, z, rot) {
  const [w, d] = footprint(b, rot);
  return { x: THREE.MathUtils.clamp(x, 0, GRID - w), z: THREE.MathUtils.clamp(z, 0, GRID - d) };
}

function scatterNature() {
  const center = GRID / 2;
  let tries = 0;
  for (const [type, n] of Object.entries(NATURE_COUNTS)) {
    let placedN = 0;
    while (placedN < n && tries++ < 800) {
      const x = 1 + Math.floor(Math.random() * (GRID - 2));
      const z = 1 + Math.floor(Math.random() * (GRID - 2));
      if (G.occ.has(key(x, z))) continue;
      const dc = Math.hypot(x - center, z - center);
      if (dc < 3.5) continue;                                     // 中心留空地给村庄
      if (type !== 'bush' && dc > 4 && dc < 5.2 && Math.random() < .7) continue;
      const nd = NATURE_DEFS[type];
      const inst = protos['nat_' + type].clone();
      inst.position.set(x + .5 + (Math.random() - .5) * .25, 0, z + .5 + (Math.random() - .5) * .25);
      inst.rotation.y = Math.random() * Math.PI * 2;
      inst.scale.setScalar(.8 + Math.random() * .45);
      scene.add(inst);
      const node = { type, def: nd, inst, x, z, hp: nd.hp, alive: true, respawnDay: 0 };
      G.nature.push(node);
      G.occ.set(key(x, z), node);
      placedN++;
    }
  }
}
function scatterDeco() {
  for (const [type, n] of Object.entries(SCATTER_COUNTS)) {
    for (let i = 0, tries = 0; i < n && tries < 300; tries++) {
      const x = Math.random() * (GRID - 1), z = Math.random() * (GRID - 1);
      if (G.occ.has(key(Math.floor(x), Math.floor(z)))) continue;
      const inst = protos['deco_' + type].clone();
      inst.position.set(x, 0, z);
      inst.rotation.y = Math.random() * Math.PI * 2;
      inst.scale.setScalar(.7 + Math.random() * .6);
      scene.add(inst);
      i++;

}
function chopDone(node) {
  node.hp--;
  if (node.hp <= 0) {
    node.alive = false;
    scene.remove(node.inst);
    if (G.occ.get(key(node.x, node.z)) === node) G.occ.delete(key(node.x, node.z));
    node.respawnDay = G.day + (node.def.regrow || 9999);
    if (!node.def.regrow) G.nature = G.nature.filter(n => n !== node);
  }
}
function regrow() {
  for (const n of G.nature) {
    if (!n.alive && G.day >= n.respawnDay && !G.occ.has(key(n.x, n.z))) {
      n.alive = true; n.hp = n.def.hp; scene.add(n.inst);
      G.occ.set(key(n.x, n.z), n);
    }
  }
}

function spawnVillagers(n) {
  for (let i = 0; i < n; i++) {
    const src = protos['char' + (G.villagers.length % CHAR_FILES.length)];
    const inner = new THREE.Group();
    let bones = null;
    if (src.skin) {
      // 每个村民一套独立骨架；关节位置 = 骨段起点（绝对坐标，相对父骨骼偏移）
      const { geoList, segs } = src.skin;
      const S = Object.fromEntries(segs.map(s => [s.name, s]));
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const mk = (name, pos, parent) => { const b = new THREE.Bone(); b.name = name; b.position.set(...pos); parent.add(b); return b; };
      const hips = new THREE.Bone(); hips.name = 'hips'; hips.position.set(...S.spine.a);
      const spine = mk('spine', [0, 0, 0], hips);                     // 脊柱关节与髋同点
      const head = mk('head', sub(S.head.a, S.spine.a), spine);
      const armL = mk('armL', sub(S.armL.a, S.spine.a), spine);
      const armR = mk('armR', sub(S.armR.a, S.spine.a), spine);
      const legL = mk('legL', sub(S.legL.a, S.spine.a), hips);
      const legR = mk('legR', sub(S.legR.a, S.spine.a), hips);
      bones = { hips, spine, head, armL, armR, legL, legR };
      inner.add(hips);
      hips.updateMatrixWorld(true);
      const skeleton = new THREE.Skeleton([hips, spine, head, armL, armR, legL, legR]);
      const order = ['hips', 'spine', 'head', 'armL', 'armR', 'legL', 'legR'];
      const segToBone = segs.map(s => order.indexOf(s.name));
      for (const srcItem of geoList) {
        const geo = srcItem.geo.clone();
        const si = geo.getAttribute('skinIndex');
        const remap = new Uint16Array(si.array.length);
        for (let vi = 0; vi < si.count; vi++)
          for (let k = 0; k < 4; k++) remap[vi * 4 + k] = segToBone[si.getComponent(vi, k)] >= 0 ? segToBone[si.getComponent(vi, k)] : 0;
        geo.setAttribute('skinIndex', new THREE.BufferAttribute(remap, 4));
        const sm = new THREE.SkinnedMesh(geo, srcItem.material);
        sm.castShadow = true;
        sm.frustumCulled = false;
        inner.add(sm);
        sm.bind(skeleton, new THREE.Matrix4());
      }
    } else {
      inner.add(src.clone());
    }
    const wrap = new THREE.Group();
    const box = new THREE.Box3().setFromObject(inner);
    const size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    inner.position.set(-c.x, -box.min.y, -c.z);
    wrap.scale.setScalar(0.55 / size.y);     // 村民约半格高：房子该比人大
    wrap.add(inner);
    wrap.position.set(GRID / 2 + (Math.random() - .5) * 3, 0, GRID / 2 + (Math.random() - .5) * 3);
    const ring = new THREE.Mesh(new THREE.RingGeometry(.28, .36, 24).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x8fc0ff, transparent: true, opacity: .9, depthWrite: false }));
    ring.position.y = .02; ring.visible = false;
    wrap.add(ring);
    scene.add(wrap);
    G.villagers.push({ name: VNAMES[G.villagers.length % VNAMES.length], obj: wrap, bones, ring, task: null, resume: null, carry: {} });
  }
}
function command(v, kind, target) { v.task = { kind, target, workT: 0 }; }

/* ---- 骨骼动画（有骨架用骨骼，无骨架退回整体摆动） ---- */
function animWalk(v, t) {
  const s = Math.sin(t * 10);
  if (v.bones) {
    v.bones.legL.rotation.x = s * .55;
    v.bones.legR.rotation.x = -s * .55;
    v.bones.armL.rotation.x = -s * .45;
    v.bones.armR.rotation.x = s * .45;
    v.bones.spine.rotation.x = .08;
    v.obj.position.y = Math.abs(s) * .03;
  } else {
    v.obj.children[0].rotation.x = .06 + s * .06;
    v.obj.position.y = Math.abs(s) * .05;
  }
}
function animWork(v, t) {
  const s = Math.sin(t * 12);
  if (v.bones) {
    v.bones.armR.rotation.x = -.7 - s * .5;          // 右臂抡起砍下
    v.bones.armL.rotation.x = -.15;
    v.bones.spine.rotation.x = .18 + s * .1;         // 前倾发力
    v.bones.legL.rotation.x = v.bones.legR.rotation.x = 0;
    v.obj.position.y = Math.abs(s) * .02;
  } else {
    v.obj.children[0].rotation.x = .12 + s * .12;
    v.obj.position.y = Math.abs(s) * .04;
  }
}
function animIdle(v, t) {
  const s = Math.sin(t * 2);
  if (v.bones) {
    for (const b of ['legL', 'legR', 'armL', 'armR']) v.bones[b].rotation.x *= .9;
    v.bones.spine.rotation.x *= .9;
    v.bones.spine.rotation.z = s * .03;              // 呼吸般轻晃
  } else {
    v.obj.children[0].rotation.x *= .9;
    v.obj.position.y = 0;
  }
}

/* ---- 掉落物与搬运 ---- */
const dropGeo = new THREE.IcosahedronGeometry(.14, 0);
function spawnDrop(res, amt, pos) {
  const mesh = new THREE.Mesh(dropGeo, new THREE.MeshLambertMaterial({ color: RES_INFO[res].color }));
  mesh.position.set(pos.x + (Math.random() - .5) * .8, .5, pos.z + (Math.random() - .5) * .8);
  mesh.castShadow = true;
  scene.add(mesh);
  G.drops.push({ mesh, res, amt, x: mesh.position.x, z: mesh.position.z, baseY: .14, t: Math.random() * 6 });
}
function stepDrops(dt, t) {
  for (const d of G.drops) {
    d.t += dt;
    d.mesh.position.y = d.baseY + Math.abs(Math.sin(d.t * 3)) * .06;   // 落地小弹跳感
    d.mesh.rotation.y += dt * 2;
  }
}
const carryTotal = v => Object.values(v.carry).reduce((s, n) => s + n, 0);
function startDeliver(v) {
  const depot = findDepot(v);
  v.task = depot ? { kind: 'deliver', target: depot } : { kind: 'deliver', target: { x: GRID / 2 + 1.5, z: GRID / 2 + 1.5 } };
}
function findDepot(v) {
  // 优先送他带得最多的资源对应的建筑；没有就送任意生产建筑
  let heaviest = null, best = -1;
  for (const [res, n] of Object.entries(v.carry)) if (n > best) { best = n; heaviest = res; }
  if (!heaviest) return null;
  const role = RES_INFO[heaviest].depotRole;
  return G.placed.find(p => p.def.role === role) || G.placed.find(p => p.def.role === 'wood' || p.def.role === 'food') || null;
}
function deliverCarry(v) {
  let got = [];
  for (const [res, n] of Object.entries(v.carry)) {
    if (!n) continue;
    const cap = res === 'food' ? G.foodCap : 9999;
    G.res[res] = Math.min(cap, G.res[res] + n);
    got.push('+' + n + RES_INFO[res].icon);
  }
  if (got.length) floatText(got.join(' '), v.obj.position);
  v.carry = {};
  v.resume = null;
}
/* ---- 浮动小字 ---- */
function floatText(text, worldPos) {
  const p = worldPos.clone(); p.y = 1.1; p.project(cam);
  const r = dom.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = text;
  el.style.left = (r.left + (p.x + 1) / 2 * r.width) + 'px';
  el.style.top = (r.top + (1 - p.y) / 2 * r.height) + 'px';
  document.getElementById('main').appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function stepVillager(v, dt, t) {
  const speed = 1.5;
  // 路过掉落物顺手拾取
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    if (carryTotal(v) < CARRY_CAP && Math.hypot(d.x - v.obj.position.x, d.z - v.obj.position.z) < .8) {
      v.carry[d.res] = (v.carry[d.res] || 0) + d.amt;
      scene.remove(d.mesh);
      G.drops.splice(i, 1);
      floatText('+' + d.amt + ' ' + RES_INFO[d.res].icon, v.obj.position);
    }
  }
  // 携满（任意任务中）→ 立即送货
  if (v.task && v.task.kind !== 'deliver' && carryTotal(v) >= CARRY_CAP) {
    if (v.task.kind === 'chop' && v.task.target.alive) v.resume = { kind: 'chop', target: v.task.target };
    startDeliver(v);
  }
  // 闲置且附近有掉落物 → 主动去捡
  if (!v.task && carryTotal(v) < CARRY_CAP) {
    let near = null, nd = 8;
    for (const d of G.drops) {
      const dist = Math.hypot(d.x - v.obj.position.x, d.z - v.obj.position.z);
      if (dist < nd) { nd = dist; near = d; }
    }
    if (near) v.task = { kind: 'fetch', target: near };
    else if (carryTotal(v) > 0) startDeliver(v);      // 没更多掉落物了，把货送了
  }
  // 砍伐目标耗尽且身上有货 → 送去入库（完事回来继续砍）
  if (v.task && v.task.kind === 'chop' && carryTotal(v) > 0 && (carryTotal(v) >= CARRY_CAP || !v.task.target.alive)) {
    const depot = findDepot(v);
    v.resume = v.task.target.alive ? { kind: 'chop', target: v.task.target } : null;
    v.task = depot ? { kind: 'deliver', target: depot } : { kind: 'deliver', target: { x: GRID / 2 + 1.5, z: GRID / 2 + 1.5 } };
  }
  let dest = null, arriveR = .6;
  if (v.task) {
    if (v.task.kind === 'move') { dest = v.task.target; arriveR = .25; }
    else if (v.task.kind === 'chop') {
      if (!v.task.target.alive) { v.task = null; }
      else { dest = v.task.target.inst.position; arriveR = 1.15; }
    } else if (v.task.kind === 'work') {
      if (!G.placed.includes(v.task.target)) { v.task = null; }
      else { dest = v.task.target.inst.position; arriveR = 1.3; }
    } else if (v.task.kind === 'deliver') {
      dest = v.task.target.inst ? v.task.target.inst.position : v.task.target;
      arriveR = v.task.target.inst ? 1.6 : .4;
    } else if (v.task.kind === 'fetch') {
      if (!G.drops.includes(v.task.target)) { v.task = null; }
      else { dest = v.task.target.mesh.position; arriveR = .5; }
    }
  }
  if (!dest) { animIdle(v, t); return; }
  const dx = dest.x - v.obj.position.x, dz = dest.z - v.obj.position.z;
  const dist = Math.hypot(dx, dz);
  if (dist > arriveR) {
    const nx = v.obj.position.x + dx / dist * speed * dt;
    const nz = v.obj.position.z + dz / dist * speed * dt;
    const blocker = G.occ.get(key(Math.floor(nx), Math.floor(nz)));
    if (blocker && blocker.inst && G.placed.includes(blocker)) {
      // 建筑挡路：沿切线绕行
      v.obj.position.x += dz / dist * speed * dt * (v._side || (v._side = Math.random() < .5 ? 1 : -1));
    } else { v.obj.position.x = nx; v.obj.position.z = nz; v._side = 0; }
    v.obj.rotation.y = Math.atan2(dx, dz);
    animWalk(v, t);
    return;
  }
  if (v.task.kind === 'move' || v.task.kind === 'fetch') { v.task = null; return; }
  if (v.task.kind === 'deliver') {
    deliverCarry(v);
    v.task = v.resume && v.resume.target.alive ? { kind: 'chop', target: v.resume.target, workT: 0 } : null;
    v.resume = null;
    return;
  }
  v.task.workT += dt;
  animWork(v, t);
  if (v.task.workT >= v.task.target.def.work) {
    v.task.workT = 0;
    if (v.task.kind === 'chop') {
      const node = v.task.target;
      spawnDrop(node.def.yield, node.def.amt, node.inst.position);
      chopDone(node);
    }
    // 'work'：建筑产出走天结算，出勤即可
  }
}

/* =====================================================================

const padMat = new THREE.MeshLambertMaterial({ color: 0x9db972 });
const padGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
function makePad(b, rot) {
  const [w, d] = footprint(b, rot);
  const pad = new THREE.Mesh(padGeo, padMat);
  pad.scale.set(w * .99, 1, d * .99);
  pad.position.set(w / 2, .006, d / 2);
  pad.receiveShadow = true;
  const g = new THREE.Group();
  g.add(pad);
  return g;
}
const dropAnims = [];
function startDropAnim(inst) { inst.userData.anim = { t: 0, fromY: 1.1 }; dropAnims.push(inst); }
function stepDropAnims(dt) {
  for (let i = dropAnims.length - 1; i >= 0; i--) {
    const inst = dropAnims[i], a = inst.userData.anim;
    a.t = Math.min(1, a.t + dt * 5);
    inst.position.y = (inst.userData.baseY || 0) + a.fromY * Math.pow(1 - a.t, 3);
    if (a.t >= 1) { inst.position.y = inst.userData.baseY || 0; dropAnims.splice(i, 1); }
  }
}
function placeInstance(def, x, z, rot, animate) {
  const pad = makePad(def, rot);
  pad.position.set(x, 0, z);
  scene.add(pad);
  const inst = protos[def.id].clone();
  const [w, d] = footprint(def, rot);
  inst.position.set(x + w / 2, CELL_SINK, z + d / 2);
  inst.rotation.y = rot * Math.PI / 2;
  inst.userData.baseY = CELL_SINK;
  scene.add(inst);
  const entry = { def, inst, pad, x, z, rot };
  cellsOf(def, x, z, rot).forEach(k => G.occ.set(k, entry));
  G.placed.push(entry);
  if (animate) startDropAnim(inst);
  if (def.role === 'happy') G.happy += def.add;
  if (def.role === 'granary') G.foodCap += 25;
  return entry;
}
function removeEntry(entry) {
  cellsOf(entry.def, entry.x, entry.z, entry.rot).forEach(k => { if (G.occ.get(k) === entry) G.occ.delete(k); });
  scene.remove(entry.inst, entry.pad);
  G.placed = G.placed.filter(p => p !== entry);
  G.villagers.forEach(v => { if (v.task && v.task.target === entry) v.task = null; });
  if (entry.def.role === 'happy') G.happy -= entry.def.add;
  if (entry.def.role === 'granary') G.foodCap -= 25;
  UI.refresh();
}

// 幽灵预览：半透明模型 + 脚印格
const ghostOK  = new THREE.MeshBasicMaterial({ color: 0xaaffaa, transparent: true, opacity: .5, depthWrite: false });
const ghostBad = new THREE.MeshBasicMaterial({ color: 0xff6655, transparent: true, opacity: .5, depthWrite: false });
const fpUnitGeo = new THREE.PlaneGeometry(0.96, 0.96).rotateX(-Math.PI / 2);
const ghost = { model: null, fp: null };
function showGhost(def) {
  hideGhost();
  if (!protos[def.id]) return;
  ghost.model = protos[def.id].clone();
  ghost.fp = new THREE.Group();
  scene.add(ghost.model, ghost.fp);
}
function hideGhost() {
  if (ghost.model) scene.remove(ghost.model);
  if (ghost.fp) scene.remove(ghost.fp);
  ghost.model = ghost.fp = null;
}
function updateGhost(def, cell, rot) {
  if (!ghost.model) return;
  const [w, d] = footprint(def, rot);
  const ok = canPlace(def, cell.x, cell.z, rot) && canAfford(def);
  const mat = ok ? ghostOK : ghostBad;
  ghost.model.traverse(o => { if (o.isMesh) o.material = mat; });
  ghost.model.position.set(cell.x + w / 2, CELL_SINK + .02, cell.z + d / 2);
  ghost.model.rotation.y = rot * Math.PI / 2;
  ghost.fp.clear();
  for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) {
    const p = new THREE.Mesh(fpUnitGeo, mat);
    p.position.set(cell.x + i + .5, .03, cell.z + j + .5);
    ghost.fp.add(p);
  }
}

/* =====================================================================
 * 8. 拾取
 * ===================================================================*/
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function setRay(e) {
  const r = dom.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, cam);
}
function toGround(e) {
  setRay(e);
  const pt = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, pt) ? pt : null;
}
function pickAt(e, list, filterAlive) {
  setRay(e);
  const hits = raycaster.intersectObjects(list.map(p => p.inst || p.obj), true);
  for (const h of hits) {
    let o = h.object;
    while (o) {
      const found = list.find(p => (p.inst || p.obj) === o);
      if (found && (!filterAlive || found.alive !== false)) return found;
      o = o.parent;
    }
  }
  return null;
}

/* =====================================================================
 * 9. 输入状态机
 *    idle → maybeSelect → boxSelect
 *    idle → placing（建造）
 *    idle → movingBuilding（搬移）
 *    any  → panning（中键）
 * ===================================================================*/
const S = {
  mode: 'idle',            // idle | maybeSelect | boxSelect | placing | movingBuilding | panning
  placingDef: null,        // 建造中的建筑定义
  rot: 0, cell: { x: 0, z: 0 },
  moving: null,            // 搬移中的建筑 entry
  downAt: null,
};
const keys = {};

function setBuildGridVisible(on) { buildGrid.visible = on; }

function startPlacing(def) {
  cancelPlacing();
  S.placingDef = def;
  S.rot = 0;
  S.mode = 'placing';
  setBuildGridVisible(true);
  showGhost(def);
  document.querySelectorAll('.b').forEach(e => e.classList.remove('sel'));
  document.getElementById('b-' + def.id).classList.add('sel');
  dom.style.cursor = 'copy';
}
function cancelPlacing() {
  S.placingDef = null;
  if (S.mode === 'placing') S.mode = 'idle';
  setBuildGridVisible(false);
  hideGhost();
  document.querySelectorAll('.b').forEach(e => e.classList.remove('sel'));
  dom.style.cursor = 'default';
}
function startMoving(entry) {
  cancelPlacing();
  S.moving = entry;
  S.rot = entry.rot;
  S.mode = 'movingBuilding';
  setBuildGridVisible(true);
}
function finishMoving(commit) {
  const m = S.moving;
  if (!m) return;
  if (commit && S.movingValid) {
    cellsOf(m.def, m.x, m.z, m.rot).forEach(k => { if (G.occ.get(k) === m) G.occ.delete(k); });
    m.x = S.cell.x; m.z = S.cell.z; m.rot = S.rot;
    const [w, d] = footprint(m.def, m.rot);
    m.inst.position.set(m.x + w / 2, CELL_SINK, m.z + d / 2);
    m.inst.rotation.y = m.rot * Math.PI / 2;
    m.pad.position.set(m.x, 0, m.z);
    m.pad.clear();
    m.pad.add(makePad(m.def, m.rot).children[0].clone());
    cellsOf(m.def, m.x, m.z, m.rot).forEach(k => G.occ.set(k, m));
  } else {
    m.inst.position.set(m.x + footprint(m.def, m.rot)[0] / 2, CELL_SINK, m.z + footprint(m.def, m.rot)[1] / 2);
    m.inst.rotation.y = m.rot * Math.PI / 2;
  }
  m.inst.traverse(o => { if (o.isMesh && o.userData.origMat) o.material = o.userData.origMat; });
  S.moving = null;
  S.mode = 'idle';
  setBuildGridVisible(false);
}
function beginDragMove(e, entry) {
  startMoving(entry);
  entry.inst.traverse(o => { if (o.isMesh) { o.userData.origMat = o.material; o.material = ghostOK; } });
  stepDragMove(e);
}
function stepDragMove(e) {
  if (e && e.clientX !== undefined) S.lastMoveEv = e;
  const m = S.moving;
  if (!m) return;
  const pt = toGround(S.lastMoveEv || e);
  if (!pt) return;
  S.cell = clampCell(m.def, Math.floor(pt.x), Math.floor(pt.z), S.rot);
  const [w, d] = footprint(m.def, S.rot);
  m.inst.position.set(S.cell.x + w / 2, .05, S.cell.z + d / 2);
  m.inst.rotation.y = S.rot * Math.PI / 2;
  S.movingValid = canPlace(m.def, S.cell.x, S.cell.z, S.rot, m);
  const mat = S.movingValid ? ghostOK : ghostBad;
  m.inst.traverse(o => { if (o.isMesh && o.userData.origMat) o.material = mat; });
}

const selrect = document.getElementById('selrect');
function inMainViewport(e) {
  const r = dom.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
}

addEventListener('pointerdown', e => {
  if (e.target !== dom || G.over) return;
  S.downAt = { x: e.clientX, y: e.clientY };
  try { dom.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.button === 2) return;                       // 右键在 up 时发指令
  if (e.button === 1) { S.mode = 'panning'; e.preventDefault(); return; }
  if (e.button !== 0) return;
  if (S.mode === 'placing') return;
  // 按在建筑上 → 待定（拖拽=搬移，点击=信息面板）
  const bld = pickAt(e, G.placed);
  if (bld) { S.mode = 'maybeMove'; S.moving = bld; S.rot = bld.rot; return; }
  S.mode = 'maybeSelect';
});
addEventListener('pointermove', e => {
  if (G.over) return;
  if ((S.mode === 'maybeSelect' || S.mode === 'maybeMove') && S.downAt &&
      (Math.abs(e.clientX - S.downAt.x) > DRAG_TOLERANCE || Math.abs(e.clientY - S.downAt.y) > DRAG_TOLERANCE)) {
    if (S.mode === 'maybeMove') beginDragMove(e, S.moving);
    else S.mode = 'boxSelect';
  }
  switch (S.mode) {
    case 'boxSelect': {
      const m = mainEl.getBoundingClientRect();
      selrect.style.display = 'block';
      selrect.style.left = Math.min(S.downAt.x, e.clientX) - m.left + 'px';
      selrect.style.top = Math.min(S.downAt.y, e.clientY) - m.top + 'px';
      selrect.style.width = Math.abs(e.clientX - S.downAt.x) + 'px';
      selrect.style.height = Math.abs(e.clientY - S.downAt.y) + 'px';
      return;
    }
    case 'movingBuilding': stepDragMove(e); return;
    case 'placing': {
      if (!inMainViewport(e)) return;
      const pt = toGround(e);
      if (pt && S.placingDef) {
        S.cell = clampCell(S.placingDef, Math.floor(pt.x), Math.floor(pt.z), S.rot);
        updateGhost(S.placingDef, S.cell, S.rot);
      }
      return;
    }
    case 'panning': {
      if (e.movementX || e.movementY) {
        const sp = camCtl.r * .0016, f = camCtl.fwd(), r = camCtl.right();
        camCtl.pan(-e.movementX * sp * r.x + e.movementY * sp * f.x,
                   -e.movementX * sp * r.z + e.movementY * sp * f.z);
      }
      return;
    }
    case 'idle': {
      if (!inMainViewport(e)) return;
      UI.hoverTip(e);
      return;
    }
  }
});
addEventListener('pointerup', e => {
  if (G.over) return;
  selrect.style.display = 'none';
  const wasClick = S.downAt && Math.abs(e.clientX - S.downAt.x) < DRAG_TOLERANCE && Math.abs(e.clientY - S.downAt.y) < DRAG_TOLERANCE;

  if (e.button === 2) {
    if (S.mode === 'movingBuilding') { finishMoving(false); }
    else if (G.selected.size) Input.issueCommand(e);
    S.mode = S.placingDef ? 'placing' : 'idle';
    S.downAt = null;
    return;
  }
  if (S.mode === 'boxSelect') {
    Input.selectInScreenRect(S.downAt, e);
  } else if (S.mode === 'maybeSelect' && wasClick && e.button === 0) {
    Input.clickSelect(e);
  } else if (S.mode === 'maybeMove' && wasClick && e.button === 0) {
    UI.showBuildingInfo(S.moving);                   // 点建筑：信息面板
    S.moving = null;
  } else if (S.mode === 'movingBuilding') {
    finishMoving(true);                              // 拖拽搬移：提交新位置
  } else if (S.mode === 'placing' && wasClick && e.button === 0 && S.placingDef) {
    if (canPlace(S.placingDef, S.cell.x, S.cell.z, S.rot) && canAfford(S.placingDef)) {
      pay(S.placingDef);
      placeInstance(S.placingDef, S.cell.x, S.cell.z, S.rot, true);
      toast('🔨 ' + S.placingDef.name + ' 建成');
      cancelPlacing();
      UI.refresh();
    }
  }
  if (S.mode !== 'panning') S.mode = S.placingDef ? 'placing' : 'idle';
  S.downAt = null;
});
addEventListener('dragstart', e => e.preventDefault());
dom.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { cancelPlacing(); Input.clearSelection(); UI.hideInfo(); return; }
  if (['w','a','s','d','q','e','r'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 'r' && S.placingDef) {
    S.rot = (S.rot + 1) % 4;
    S.cell = clampCell(S.placingDef, S.cell.x, S.cell.z, S.rot);
    updateGhost(S.placingDef, S.cell, S.rot);
  }
  if (k === 'r' && S.mode === 'movingBuilding' && S.moving) {
    S.rot = (S.rot + 1) % 4;
    stepDragMove();                                  // 用上次指针位置重算
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
dom.addEventListener('wheel', e => {
  e.preventDefault();
  camCtl.r = THREE.MathUtils.clamp(camCtl.r + e.deltaY * .02, 7, 55);
  camCtl.apply();
}, { passive: false });
document.getElementById('zin').onclick  = () => { camCtl.r = Math.max(7, camCtl.r - 4); camCtl.apply(); };
document.getElementById('zout').onclick = () => { camCtl.r = Math.min(55, camCtl.r + 4); camCtl.apply(); };

// 键盘相机
function stepCameraKeys() {
  const sp = camCtl.r * .02, f = camCtl.fwd(), r = camCtl.right();
  if (keys.w) camCtl.pan( f.x * sp,  f.z * sp);
  if (keys.s) camCtl.pan(-f.x * sp, -f.z * sp);
  if (keys.d) camCtl.pan( r.x * sp,  r.z * sp);
  if (keys.a) camCtl.pan(-r.x * sp, -r.z * sp);
  if (keys.q) { camCtl.theta += .03; camCtl.apply(); }
  if (keys.e) { camCtl.theta -= .03; camCtl.apply(); }
}

// 指令与选择（从输入事件里剥离出来的游戏语义）
const Input = {
  issueCommand(e) {
    const nat = pickAt(e, G.nature, true);
    if (nat) {
      G.selected.forEach(v => command(v, 'chop', nat));
      toast(`${nat.def.name} ×${G.selected.size} 人前往（${nat.def.yield === 'wood' ? '砍伐' : '采集'}）`);
      return;
    }
    const bld = pickAt(e, G.placed);
    if (bld && (bld.def.role === 'wood' || bld.def.role === 'food')) {
      G.selected.forEach(v => command(v, 'work', bld));
      toast(`派 ${G.selected.size} 人到 ${bld.def.name} 上工`);
      return;
    }
    const pt = toGround(e);
    if (pt) {
      let i = 0;
      G.selected.forEach(v => {
        const a = (i++ / G.selected.size) * Math.PI * 2;
        command(v, 'move', new THREE.Vector3(pt.x + Math.cos(a) * .5, 0, pt.z + Math.sin(a) * .5));
      });
    }
  },
  selectInScreenRect(downAt, e) {
    const r = dom.getBoundingClientRect();
    const x1 = Math.min(downAt.x, e.clientX), x2 = Math.max(downAt.x, e.clientX);
    const y1 = Math.min(downAt.y, e.clientY), y2 = Math.max(downAt.y, e.clientY);
    this.clearSelection();
    const p = new THREE.Vector3();
    for (const v of G.villagers) {
      p.copy(v.obj.position); p.y = .5; p.project(cam);
      const sx = r.left + (p.x + 1) / 2 * r.width, sy = r.top + (1 - p.y) / 2 * r.height;
      if (sx >= x1 && sx <= x2 && sy >= y1 && sy <= y2) { G.selected.add(v); v.ring.visible = true; }
    }
    UI.selectionChanged();
    if (G.selected.size) toast('已选中 ' + G.selected.size + ' 人，右键派活');
  },
  clickSelect(e) {
    const vil = pickAt(e, G.villagers);
    if (vil) {
      if (e.shiftKey) {
        G.selected.has(vil) ? (G.selected.delete(vil), vil.ring.visible = false) : (G.selected.add(vil), vil.ring.visible = true);
      } else {
        this.clearSelection(); G.selected.add(vil); vil.ring.visible = true;
      }
      UI.selectionChanged();
      return;
    }
    const bld = pickAt(e, G.placed);
    if (bld) { UI.showBuildingInfo(bld); return; }
    this.clearSelection();
    UI.hideInfo();
  },
  clearSelection() {
    G.selected.forEach(v => v.ring.visible = false);
    G.selected.clear();
    UI.selectionChanged();
  },
};

/* =====================================================================
 * 10. 模拟 —— 经济、日程、夜晚结算
 * ===================================================================*/
function houseCapacity() { return G.placed.filter(p => p.def.role === 'house').reduce((s, p) => s + p.def.cap, 0); }
function houseHappiness() {
  const houses = G.placed.filter(p => p.def.role === 'house');
  const good = houses.filter(p => G.placed.some(w => w.def.role === 'well' && Math.abs(w.x - p.x) <= 6 && Math.abs(w.z - p.z) <= 6))
                     .reduce((s, p) => s + p.def.cap, 0);
  const total = houses.reduce((s, p) => s + p.def.cap, 0);
  return total ? good / total : 1;
}
function productionPerDay() {
  let wood = 0, food = 0;
  const eff = (0.6 + G.happy / 250) * (0.5 + 0.5 * houseHappiness());
  const winter = G.day >= WINTER_DAY;
  for (const p of G.placed) {
    if (p.def.role !== 'wood' && p.def.role !== 'food') continue;
    const n = G.villagers.filter(v => v.task && v.task.kind === 'work' && v.task.target === p).length;
    if (!n) continue;
    const rate = winter && p.def.id !== 'greenhouse' ? 0.3 : 1;
    if (p.def.role === 'wood') wood += p.def.out * Math.min(n, 2) * eff;
    else food += p.def.out * Math.min(n, 2) * eff * rate;
  }
  return { wood, food };
}
function nightSettlement() {
  const need = G.villagers.length;
  if (G.res.food >= need) G.res.food -= need;
  else {
    G.res.food = 0; G.happy -= 15;
    const leaver = G.villagers.pop();
    if (leaver) { scene.remove(leaver.obj); G.selected.delete(leaver); toast(`😢 ${leaver.name} 饿坏了，离开了村庄`); }
  }
  if (G.day >= WINTER_DAY) G.happy -= 6; else G.happy = Math.min(100, G.happy + 4);
  const roll = Math.random();
  if (roll < 0.22 && G.day >= 3) {
    if (!G.placed.some(p => p.def.role === 'tower')) {
      const loss = Math.min(G.res.food, 4 + Math.floor(Math.random() * 4));
      G.res.food -= loss;
      toast(`🐺 狼群偷粮！损失 ${loss} 食（建瞭望塔可防）`);
    } else toast('🐺 狼群被瞭望塔吓退了');
  } else if (roll < 0.4 && houseCapacity() > G.villagers.length && G.res.food >= G.villagers.length) {
    spawnVillagers(1);
    toast(`🎉 旅行者加入村庄（现 ${G.villagers.length} 人）`);
  } else if (roll < 0.5) { G.res.wood += 3; toast('🌊 河水送来浮木 +3 木'); }
  G.happy = Math.max(0, G.happy);
  G.day++;
  regrow();
  if (G.day === WINTER_DAY) toast('❄ 冬天来了！露天产出大减，温室/囤粮是关键');
  if (G.day >= END_DAY) { endGame(); return; }
  UI.refresh();
}
function endGame() {
  G.over = true;
  const pop = G.villagers.length;
  document.getElementById('end').style.display = 'flex';
  if (pop >= 3) {
    document.getElementById('end-title').textContent = '🌸 春天来了——活过了冬天！';
    document.getElementById('end-desc').textContent = `最终人口 ${pop}，余粮 ${Math.floor(G.res.food)}，快乐 ${Math.round(G.happy)}。`;
  } else {
    document.getElementById('end-title').textContent = '❄ 村庄没能撑过冬天';
    document.getElementById('end-desc').textContent = `春天只剩 ${pop} 人（需 ≥3）。多囤粮、早建温室、盯紧快乐。`;
  }
}

/* =====================================================================
 * 11. UI —— 侧栏、缩略图、选择面板、提示

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

const UI = {
  curCat: '全部',
  infoEntry: null,       // 当前展示的建筑
  infoVillager: null,    // 当前展示的村民

  initSidebar() {
    const catsEl = document.getElementById('cats');

      b.textContent = c;
      if (c === this.curCat) b.className = 'on';

        [...catsEl.children].forEach(x => x.className = '');
        b.className = 'on';
        this.renderList();
      };
      catsEl.appendChild(b);
    });
    const listEl = document.getElementById('list');
    DEFS.forEach(def => {
      const row = document.createElement('div');
      row.className = 'b';
      row.id = 'b-' + def.id;
      row.innerHTML = `<img draggable="false"><div class="tx"><div class="nm">${def.name}</div><div class="cost">${Object.entries(def.cost).map(([r, v]) => v + RES_INFO[r].label).join(' ')}</div></div>`;
      row.onmouseenter = e => UI.showSideTip(def, row);

      };

    });
  },

  renderList() {    DEFS.forEach(def => {
      const row = document.getElementById('b-' + def.id);
      if (!row) return;                                   // 侧栏尚未初始化
      row.style.display = (this.curCat === '全部' || def.cat === this.curCat) ? 'flex' : 'none';
      row.classList.toggle('poor', !canAfford(def));
    });
  },

  // 缩略图渲染队列（共用一个离屏渲染器）
  thumbQueue: [],
  startThumbs() {
    DEFS.forEach(d => this.thumbQueue.push(d));
    this.pumpThumb();
  },
  pumpThumb() {
    const def = this.thumbQueue.shift();
    if (!def) return;
    try {
    if (!UI._thumbR) {
      const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      r.setSize(96, 96);
      r.toneMappingExposure = 1.4;
      const sc = new THREE.Scene();
      sc.background = new THREE.Color(0xf5f1e6);
      const tl = new THREE.DirectionalLight(0xfff0d8, 2.4); tl.position.set(3, 5, 2);
      sc.add(tl, new THREE.HemisphereLight(0xfff4e2, 0x8a7358, 1), new THREE.AmbientLight(0xffffff, .5));
      const c = new THREE.PerspectiveCamera(40, 1, .01, 100);
      UI._thumbR = { r, sc, c };
    }
    const { r, sc, c } = UI._thumbR;
    const obj = protos[def.id].clone();
    sc.add(obj);
    const box = new THREE.Box3().setFromObject(obj);
    const ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    obj.position.sub(new THREE.Vector3(ctr.x, box.min.y, ctr.z));
    const dd = Math.max(size.x, size.y, size.z) * 1.9;
    c.position.set(dd * .75, dd * .65, dd * .75);
    c.lookAt(0, size.y * .35, 0);
    c.far = dd * 10;
    c.updateProjectionMatrix();
    r.render(sc, c);
    const img = document.querySelector('#b-' + def.id + ' img');
    if (img) img.src = r.domElement.toDataURL();
    sc.remove(obj);
    } catch (err) { console.error('thumb fail', def.id, err); }
    requestAnimationFrame(() => UI.pumpThumb());
  },

  // 侧栏悬停说明：这张卡是干什么的
  showSideTip(def, row) {
    const tip = document.getElementById('tip');
    const roleTxt = { house: '住房 · 提升人口上限', wood: '生产 · 派村民上工产木', food: '生产 · 派村民上工产食', granary: '粮仓 · 食物上限+25', well: '设施 · 附近民居更满意', happy: '设施 · 提升快乐', market: '设施 · 4木换5食', tower: '设施 · 夜间防狼', deco: '装饰' }[def.role] || def.cat;
    tip.innerHTML = `<b>${def.name}</b><br><span style="color:#a8d8a0">${roleTxt}${def.cap ? ' · 容量' + def.cap : ''}${def.out ? ' · 产量' + def.out : ''}</span><br>${def.desc}<br><span style="color:#a89880">造价：${Object.entries(def.cost).map(([r, v]) => v + RES_INFO[r].label).join(' ')} · ${def.w}×${def.d}</span>`;
    const m = row.getBoundingClientRect(), mm = mainEl.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = '12px';
    tip.style.top = Math.max(8, m.top - mm.top) + 'px';
  },
  hideSideTip() { document.getElementById('tip').style.display = 'none'; },

  refresh() {
    document.getElementById('r-wood').textContent = Math.floor(G.res.wood);
    document.getElementById('r-food').textContent = Math.floor(G.res.food);
    document.getElementById('r-stone').textContent = Math.floor(G.res.stone);
    document.getElementById('r-happy').textContent = Math.round(G.happy);
    document.getElementById('r-pop').textContent = G.villagers.length;
    document.getElementById('r-cap').textContent = '/' + houseCapacity();
    document.getElementById('daybox').textContent = `第 ${G.day} 天 · ${SEASONS(G.day)} · ${Math.floor(G.time / DAY_SECONDS * 100)}%`;
    const vl = document.getElementById('vlist');
    vl.innerHTML = G.villagers.map(v => {
      const t = v.task;
      const st = !t ? '待命' : t.kind === 'move' ? '移动' : t.kind === 'chop' ? RES_INFO[t.target.def.yield].icon : t.kind === 'deliver' ? '📦' : '🏭';
      return `<div class="v" data-i="${G.villagers.indexOf(v)}"><span>${v.name}</span><span>${st}</span></div>`;
    }).join('');
    vl.querySelectorAll('.v').forEach(row => {
      row.onclick = () => {
        const v = G.villagers[+row.dataset.i];
        if (!v) return;
        Input.clearSelection();
        G.selected.add(v);
        v.ring.visible = true;
        UI.selectionChanged();
        camCtl.target.copy(v.obj.position);
        camCtl.apply();
      };
    });
    this.renderList();
    if (this.infoEntry && !G.placed.includes(this.infoEntry)) this.hideInfo();
  },

  selectionChanged() {
    const el = document.getElementById('selbox');
    el.style.display = G.selected.size ? 'inline' : 'none';
    el.textContent = '已选 ' + G.selected.size + ' 人';
    document.getElementById('vlist').querySelectorAll('.v').forEach((row, i) => row.classList.toggle('sel', G.selected.has(G.villagers[i])));
    if (G.selected.size === 1) this.showVillagerInfo([...G.selected][0]);
    else if (G.selected.size === 0 && this.infoVillager) this.hideInfo();
  },

  showVillagerInfo(v) {
    this.infoVillager = v;
    this.infoEntry = null;
    const el = document.getElementById('info');
    el.style.display = 'block';
    const t = v.task;
    const taskTxt = !t ? '🚶 待命' : t.kind === 'move' ? '🚶 移动中'
      : t.kind === 'chop' ? (t.target.def.yield === 'wood' ? '🪓 砍' : t.target.def.yield === 'stone' ? '⛏ 采' : '🍎 采') + t.target.def.name
      : t.kind === 'deliver' ? '📦 送货入库'
      : '🏭 ' + (t.target.def?.name || '');
    const carryTxt = carryTotal(v) ? '携带：' + Object.entries(v.carry).filter(([,n])=>n).map(([r,n]) => RES_INFO[r].icon + n).join(' ') : '';
    el.innerHTML = `<b>${v.name}</b><br><span style="color:#a89880;font-size:11px">村民 · 搬运上限 ${CARRY_CAP}</span><br>当前：${taskTxt}<br>${carryTxt}<button id="btn-stoptask">取消任务</button>`;
    document.getElementById('btn-stoptask').onclick = () => { v.task = null; this.showVillagerInfo(v); };
  },

  showBuildingInfo(entry) {
    Input.clearSelection();
    this.infoEntry = entry;
    this.infoVillager = null;
    const el = document.getElementById('info');
    el.style.display = 'block';
    const d = entry.def;
    const workers = G.villagers.filter(v => v.task && v.task.target === entry).length;
    const trade = d.role === 'market' && G.res.wood >= 4 ? '<button id="btn-trade">4 木换 5 食</button>' : '';
    el.innerHTML = `<b>${d.name}</b><br><span style="color:#a89880;font-size:11px">${d.cat} · ${d.w}×${d.d} · 拖拽可搬移</span><br>${d.desc}<br>在岗：${workers} 人${trade}<button id="btn-del">拆除</button>`;
    document.getElementById('btn-del').onclick = () => { removeEntry(entry); this.hideInfo(); };
    const bt = document.getElementById('btn-trade');
    if (bt) bt.onclick = () => {
      if (G.res.wood >= 4) { G.res.wood -= 4; G.res.food = Math.min(G.foodCap, G.res.food + 5); toast('🛒 -4 木 +5 食'); UI.refresh(); }
    };
  },

  hideInfo() { document.getElementById('info').style.display = 'none'; this.infoEntry = this.infoVillager = null; },

  hoverTip(e) {
    const tip = document.getElementById('tip');
    const nat = pickAt(e, G.nature, true);
    const bld = nat ? null : pickAt(e, G.placed);
    const vil = (nat || bld) ? null : pickAt(e, G.villagers);
    if (!nat && !bld && !vil) { tip.style.display = 'none'; return; }
    const m = mainEl.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - m.left + 14, m.width - 260) + 'px';
    tip.style.top = Math.min(e.clientY - m.top + 10, m.height - 90) + 'px';
    if (nat) tip.innerHTML = `<b>${nat.def.name}</b><br>剩余 ${nat.hp} 次 · ${RES_INFO[nat.def.yield].icon}+${nat.def.amt}/次<br><span style="color:#a89880">选村民后右键派工</span>`;
    else if (bld) tip.innerHTML = `<b>${bld.def.name}</b><br>${bld.def.desc}<br><span style="color:#a89880">点击看详情 · 拖拽可搬移${bld.def.role === 'wood' || bld.def.role === 'food' ? ' · 选村民右键它=上工' : ''}</span>`;
    else tip.innerHTML = `<b>${vil.name}</b><br>${vil.task ? '忙' : '待命'} · 点击选中`;
  },
};

/* =====================================================================
 * 12. 启动与主循环
 * ===================================================================*/
function startGame() {
  UI.initSidebar();
  scatterNature();
  scatterDeco();
  spawnVillagers(3);
  UI.startThumbs();
  UI.refresh();
  toast('🍂 目标：活到第 10 天结束人口≥3。选村民（点/框选）→ 右键树/浆果丛派工');
}
onAllLoaded = startGame;
if (pendingLoads === 0) startGame();

function resize() {
  const w = mainEl.clientWidth, h = mainEl.clientHeight;
  renderer.setSize(w, h);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
camCtl.apply();
resize();

const clock = new THREE.Clock();
window.__G = G;                                     // 调试桥
window.__camCtl = camCtl;
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  if (!G.over) {
    G.time += dt;
    const p = productionPerDay();
    G.res.wood += p.wood * dt / DAY_SECONDS;
    G.res.food = Math.min(G.foodCap, G.res.food + p.food * dt / DAY_SECONDS);
    if (G.time >= DAY_SECONDS) { G.time = 0; nightSettlement(); }
    for (const v of G.villagers) stepVillager(v, dt, t);
    if (Math.floor(t * 2) !== G._uiT) { G._uiT = Math.floor(t * 2); UI.refresh(); }
  }
  stepCameraKeys();
  stepDropAnims(dt);
  stepDrops(dt, t);
  renderer.render(scene, cam);
})();
</script>
</body>
