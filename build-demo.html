r/wc-shipyard-paint.glb"}, {"id": "bridge", "name": "石桥", "w": 3, "d": 1, "desc": "石板小桥，跨水连接两岸路网。", "glb": "ai3d-mirror/wc-bridge-paint.glb"}, {"id": "brewery", "name": "酿酒厂", "w": 3, "d": 2, "desc": "铜釜与酒桶，秋酿节主角，快乐值供应源。", "glb": "ai3d-mirror/wc-brewery-paint.glb"}, {"id": "apiary", "name": "蜂箱架", "w": 1, "d": 1, "desc": "三层蜂箱小架，春夏出产蜂蜜与蜂蜡。", "glb": "ai3d-mirror/wc-apiary-paint.glb"}, {"id": "bathhouse", "name": "澡堂", "w": 2, "d": 2, "desc": "烟囱冒蒸汽的澡堂，提升卫生与心情。", "glb": "ai3d-mirror/wc-bathhouse-paint.glb"}, {"id": "dovecote", "name": "鸽房", "w": 1, "d": 1, "desc": "白墙锥顶鸽房，鸽子起落的村中风景。", "glb": "ai3d-mirror/wc-dovecote-paint.glb"}, {"id": "fountain", "name": "喷泉", "w": 2, "d": 2, "desc": "双层石喷泉，广场装饰，全局快乐+1。", "glb": "ai3d-mirror/wc-fountain-paint.glb"}, {"id": "granary", "name": "粮仓", "w": 2, "d": 3, "desc": "双筒茅草顶粮仓，谷物储备的保险柜。", "glb": "ai3d-mirror/wc-granary-paint.glb"}, {"id": "laundry", "name": "晾晒场", "w": 2, "d": 1, "desc": "晾衣绳与木盆，生活气息的小设施。", "glb": "ai3d-mirror/wc-laundry-paint.glb"}, {"id": "lighthouse", "name": "灯塔", "w": 2, "d": 2, "desc": "岩基石塔，夜晚为归人点灯。", "glb": "ai3d-mirror/wc-lighthouse-paint.glb"}, {"id": "stable", "name": "马厩", "w": 3, "d": 2, "desc": "草料马厩带围栏，牲畜过夜的地方。", "glb": "ai3d-mirror/wc-stable-paint.glb"}, {"id": "tollgate", "name": "关卡", "w": 3, "d": 1, "desc": "路障木栏带值班亭，扼守进村的路。", "glb": "ai3d-mirror/wc-tollgate-paint.glb"}, {"id": "greenhouse", "name": "温室", "w": 2, "d": 2, "desc": "玻璃木架温室，冬天也能种菜。", "glb": "ai3d-mirror/wc-greenhouse-paint.glb"}];
const GRID = 26, CELL = 1;
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87a96b);
scene.fog = new THREE.Fog(0x87a96b, 40, 95);
const mainEl = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMappingExposure = 1.3;
mainEl.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 300);
function resize(){ const w = mainEl.clientWidth, h = mainEl.clientHeight; renderer.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);
const key = new THREE.DirectionalLight(0xfff0d8, 2.4); key.position.set(10,18,8); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); const sc = key.shadow.camera; sc.left=sc.bottom=-20; sc.right=sc.top=20; sc.far=60;
const back = new THREE.DirectionalLight(0xffe8cc, 0.55); back.position.set(-8,6,-10);
scene.add(key, back, new THREE.HemisphereLight(0xfff4e2, 0x6b8a4f, 1.05), new THREE.AmbientLight(0xffffff, 0.55));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GRID*CELL, GRID*CELL), new THREE.MeshLambertMaterial({ color: 0x8fae6a }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(GRID*CELL, GRID, 0x66824c, 0x7d9a5e); grid.position.y = 0.01; scene.add(grid);
// footprint highlight for ghost
const fpGeo = new THREE.PlaneGeometry(1,1); fpGeo.rotateX(-Math.PI/2);
const fpMatOK = new THREE.MeshBasicMaterial({ color:0x99ee77, transparent:true, opacity:0.35, depthWrite:false });
const fpMatNO = new THREE.MeshBasicMaterial({ color:0xee6644, transparent:true, opacity:0.4, depthWrite:false });
let fpMesh = null;

const occ = {};
let sel = null, rot = 0, ghost = null, gx = 0, gz = 0, placed = [], hovered = null;
let camTarget = new THREE.Vector3(GRID*CELL/2, 0, GRID*CELL/2);
let camTheta = Math.PI*0.15, camPhi = Math.PI*0.34, camR = 26;
function applyCam(){
  cam.position.set(camTarget.x + camR*Math.sin(camPhi)*Math.cos(camTheta), camR*Math.cos(camPhi), camTarget.z + camR*Math.sin(camPhi)*Math.sin(camTheta));
  cam.lookAt(camTarget);
}
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function groundHit(e){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1; mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse, cam);
  const pt = new THREE.Vector3();
  if(ray.ray.intersectPlane(groundPlane, pt)) return pt;
  return null;
}
function cellsFor(bx,bz,b,r){ const w=r%2?b.d:b.w, d=r%2?b.w:b.d; const out=[]; for(let i=0;i<w;i++)for(let j=0;j<d;j++)out.push((bx+i)+','+(bz+j)); return out; }
function fits(bx,bz,b,r,skip){ const w=r%2?b.d:b.w, d=r%2?b.w:b.d; if(bx<0||bz<0||bx+w>GRID||bz+d>GRID)return false; return cellsFor(bx,bz,b,r).every(k=>!(k in occ)||(skip&&skip===occ[k])); }
const gOK = new THREE.MeshBasicMaterial({ color:0xaaffaa, transparent:true, opacity:0.45, depthWrite:false });
const gNO = new THREE.MeshBasicMaterial({ color:0xff6655, transparent:true, opacity:0.45, depthWrite:false });
function killGhost(){ if(ghost){scene.remove(ghost);ghost=null;} if(fpMesh){scene.remove(fpMesh);fpMesh=null;} }
function makeGhost(b){
  killGhost();
  const proto = protos[b.id]; if(!proto) return;
  ghost = proto.clone(); scene.add(ghost);
  fpMesh = new THREE.Group(); scene.add(fpMesh);
}
function refreshGhost(){
  if(!ghost || !sel) return;
  const ok = fits(gx,gz,sel,rot);
  ghost.traverse(c=>{ if(c.isMesh) c.material = ok?gOK:gNO; });
  const w = rot%2?sel.d:sel.w, d = rot%2?sel.w:sel.d;
  ghost.position.set((gx+w/2)*CELL, 0.02, (gz+d/2)*CELL);
  ghost.rotation.y = rot*Math.PI/2;
  if(!fpMesh){ fpMesh = new THREE.Group(); scene.add(fpMesh); }
  while(fpMesh.children.length) fpMesh.remove(fpMesh.children[0]);
  for(let i=0;i<w;i++)for(let j=0;j<d;j++){
    const p = new THREE.Mesh(fpGeo, ok?fpMatOK:fpMatNO);
    p.position.set((gx+i+0.5)*CELL, 0.03, (gz+j+0.5)*CELL);
    fpMesh.add(p);
  }
}
const protos = {};
const loader = new GLTFLoader();
let loaded = 0;
function normalize(b, root){
  root.traverse(o=>{ if(o.isMesh){ o.castShadow = true; if(o.material) o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const s = Math.max(b.w,b.d)*CELL / Math.max(size.x,size.z);
  root.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(root);
  const c = box2.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -box2.min.y, -c.z);
  const wrap = new THREE.Group(); wrap.add(root);
  return wrap;
}
BUILDINGS.forEach(b => {
  loader.load(enc(b.glb)+'?v=1', g => {
    protos[b.id] = normalize(b, g.scene);
    thumb(b);
    loaded++;
    if(loaded === BUILDINGS.length) document.getElementById('status').textContent = '已放置 0 栋';
  });
});
// thumbnails (share main renderer via offscreen render target is complex; use tiny hidden renderer)
const tw = 96;
const tR = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
tR.setSize(tw,tw); tR.toneMappingExposure = 1.4;
const tS = new THREE.Scene(); tS.background = new THREE.Color(0xf5f1e6);
const tC = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
const tK = new THREE.DirectionalLight(0xfff0d8, 2.4); tK.position.set(3,5,2);
tS.add(tK, new THREE.HemisphereLight(0xfff4e2,0x8a7358,1.0), new THREE.AmbientLight(0xffffff,0.5));
const tQ = []; let tBusy = false;
function thumb(b){
  const proto = protos[b.id]; if(!proto) return;
  tQ.push([b, proto.clone()]);
  pump();
}
function pump(){
  if(tBusy || !tQ.length) return; tBusy = true;
  const [b,obj] = tQ.shift();
  tS.add(obj);
  const bx = new THREE.Box3().setFromObject(obj);
  const c = bx.getCenter(new THREE.Vector3()), z = bx.getSize(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, bx.min.y, c.z));
  const d = Math.max(z.x,z.y,z.z)*1.9;
  tC.position.set(d*0.75, d*0.65, d*0.75); tC.lookAt(0, z.y*0.35, 0); tC.far = d*10; tC.updateProjectionMatrix();
  tR.render(tS, tC);
  const img = document.querySelector('#b-'+b.id+' img');
  if(img) img.src = tR.domElement.toDataURL();
  tS.remove(obj);
  setTimeout(()=>{ tBusy=false; pump(); }, 5);
}
const list = document.getElementById('list');
function addRow(b){
  const d = document.createElement('div'); d.className='b'; d.id='b-'+b.id;
  d.innerHTML = '<img><div><div class="nm">'+b.name+'</div><div class="sz">占地 '+b.w+'×'+b.d+'</div></div>';
  d.onclick = () => select(b);
  list.appendChild(d);
}
BUILDINGS.forEach(addRow);
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim();
  BUILDINGS.forEach(b => { document.getElementById('b-'+b.id).style.display = (!q || b.name.includes(q) || b.id.includes(q.toLowerCase())) ? 'flex' : 'none'; });
});
function select(b){
  document.querySelectorAll('.b').forEach(e=>e.classList.remove('sel'));
  document.getElementById('b-'+b.id).classList.add('sel');
  sel = b; rot = 0; hideInfo(); makeGhost(b);
  setStatus('放置模式：'+b.name+'（R 旋转 · 左键放置 · ESC 取消）');
}
function cancelSel(){ sel=null; killGhost(); document.querySelectorAll('.b').forEach(e=>e.classList.remove('sel')); setStatus(); }
function setStatus(t){ document.getElementById('status').textContent = t || ('已放置 '+placed.length+' 栋'); }
function hideInfo(){ document.getElementById('info').style.display='none'; }
function removeEntry(entry){
  entry.cells.forEach(k=>{ if(occ[k]===entry) delete occ[k]; });
  scene.remove(entry.inst);
  placed = placed.filter(p=>p!==entry);
  hideInfo(); setStatus();
}
window.removeSel = () => { if(hovered) removeEntry(hovered); };
function showInfo(entry){
  const el = document.getElementById('info');
  window.__cur = entry;
  el.style.display='block';
  el.innerHTML = '<b>'+entry.b.name+'</b><br><span class="sz">占地 '+entry.b.w+'×'+entry.b.d+'</span><br>'+entry.b.desc+'<br><button onclick="removeSel()">拆除</button>';
}
const dom = renderer.domElement;
dom.tabIndex = 0;
// camera interaction state
let mode = 'none'; // none | orbit | pan | placeMove | dragBuilding
let downX=0, downY=0, moved=false;
let dragEntry = null, dragOrig = null;
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key==='r'||e.key==='R'){ rot=(rot+1)%4; refreshGhost(); }
  if(e.key==='Escape'){ cancelSel(); hideInfo(); }
  if((e.key==='Delete'||e.key==='Backspace') && hovered) removeEntry(hovered);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function pickBuilding(e){
  const r = dom.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1; mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse, cam);
  const objs = placed.map(p=>p.inst);
  const hits = ray.intersectObjects(objs, true);
  if(!hits.length) return null;
  let o = hits[0].object;
  while(o && !placed.some(p=>p.inst===o)) o = o.parent;
  return placed.find(p=>p.inst===o) || null;
}
dom.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; moved = false;
  if(e.button === 2){ mode = 'orbit'; }
  else if(e.button === 1){ mode = 'pan'; e.preventDefault(); }
  else if(e.button === 0){
    if(sel){ mode = 'placeMove'; }
    else {
      dragEntry = pickBuilding(e);
      if(dragEntry){ mode = 'dragBuilding'; dragOrig = { x: dragEntry.inst.position.x, z: dragEntry.inst.position.z, cells: dragEntry.cells.slice() }; dragEntry.cells.forEach(k=>delete occ[k]); hideInfo(); }
      else mode = 'none';
    }
  }
});
addEventListener('pointermove', e => {
  if((keys['w']||keys['s']||keys['a']||keys['d']||keys['arrowup']||keys['arrowdown']||keys['arrowleft']||keys['arrowright'])){
    const sp = camR*0.02;
    const f = new THREE.Vector3(Math.sin(camTheta), 0, Math.sin(camTheta)).normalize();
    const rgt = new THREE.Vector3(Math.cos(camTheta), 0, -Math.sin(camTheta)).normalize();
    if(keys['w']||keys['arrowup']) camTarget.addScaledVector(f, -sp);
    if(keys['s']||keys['arrowdown']) camTarget.addScaledVector(f, sp);
    if(keys['a']||keys['arrowleft']) camTarget.addScaledVector(rgt, -sp);
    if(keys['d']||keys['arrowright']) camTarget.addScaledVector(rgt, sp);
    applyCam();
  }
  if(mode==='none'){
    // hover tooltip
    const pt = groundHit(e);
    const tip = document.getElementById('tip');
    if(pt && !sel){
      const bx = Math.floor(pt.x/CELL), bz = Math.floor(pt.z/CELL);
      const entry = occ[bx+','+bz];
      if(entry && entry !== dragEntry){
        const r = dom.getBoundingClientRect(), m = mainEl.getBoundingClientRect();
        tip.style.display='block';
        tip.style.left = Math.min(e.clientX-m.left+14, m.width-260)+'px';
        tip.style.top = Math.min(e.clientY-m.top+10, m.height-90)+'px';
        tip.innerHTML = '<b>'+entry.b.name+'</b><br>'+entry.b.desc+'<br><span style="color:#a89880">占地 '+entry.b.w+'×'+entry.b.d+' · 拖动搬家 · 点击详情</span>';
        hovered = entry; return;
      }
    }
    tip.style.display='none'; hovered=null;
    return;
  }
  const dx = e.clientX-downX, dy = e.clientY-downY;
  if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
  if(mode==='orbit' && moved){
    camTheta += e.movementX*0.006; camPhi = Math.min(1.45, Math.max(0.12, camPhi - e.movementY*0.004)); applyCam();
  } else if(mode==='pan' && moved){
    const sp = camR*0.0016;
    const f = new THREE.Vector3(Math.sin(camTheta), 0, Math.sin(camTheta)).normalize();
    const rgt = new THREE.Vector3(Math.cos(camTheta), 0, -Math.sin(camTheta)).normalize();
    camTarget.addScaledVector(rgt, -e.movementX*sp);
    camTarget.addScaledVector(f, e.movementY*sp);
    camTarget.x = Math.min(GRID*CELL*1.2, Math.max(-GRID*CELL*0.2, camTarget.x));
    camTarget.z = Math.min(GRID*CELL*1.2, Math.max(-GRID*CELL*0.2, camTarget.z));
    applyCam();
  } else if((mode==='placeMove'||mode==='dragBuilding')){
    const pt = groundHit(e);
    if(pt){
      gx = Math.floor(pt.x/CELL); gz = Math.floor(pt.z/CELL);
      if(mode==='placeMove') refreshGhost();
      else {
        const b = dragEntry.b;
        const ok = fits(gx,gz,b,rot);
        const w = rot%2?b.d:b.w, d = rot%2?b.w:b.d;
        dragEntry.inst.position.set((gx+w/2)*CELL, 0.05, (gz+d/2)*CELL);
        dragEntry.inst.rotation.y = rot*Math.PI/2;
        dragEntry.inst.traverse(c=>{ if(c.isMesh) c.material = ok?gOK:gNO; });
        dragEntry.dragOK = ok; dragEntry.gx=gx; dragEntry.gz=gz;
      }
    }
  }
});
addEventListener('pointerup', e => {
  const wasClick = !moved && Math.abs(e.clientX-downX)<5 && Math.abs(e.clientY-downY)<5;
  if(mode==='orbit' && wasClick && e.button===2){ cancelSel(); }
  if(mode==='placeMove' && wasClick && e.button===0 && sel){
    refreshGhost();
    if(fits(gx,gz,sel,rot)){
      const inst = protos[sel.id].clone();
      const w = rot%2?sel.d:sel.w, d = rot%2?sel.w:sel.d;
      inst.position.set((gx+w/2)*CELL, 0, (gz+d/2)*CELL);
      inst.rotation.y = rot*Math.PI/2;
      scene.add(inst);
      const entry = { b:sel, inst, cells:cellsFor(gx,gz,sel,rot) };
      entry.cells.forEach(k=>occ[k]=entry);
      placed.push(entry); setStatus();
    }
  }
  if(mode==='dragBuilding' && dragEntry){
    if(wasClick){ // 单击=查看详情（未拖动）
      dragEntry.cells.forEach(k=>occ[k]=dragEntry);
      showInfo(dragEntry);
      dragEntry=null; mode='none'; return;
    }
    const b = dragEntry.b;
    if(dragEntry.dragOK){
      dragEntry.inst.traverse(c=>{ if(c.isMesh && c.material!==gOK && c.material.isMeshStandardMaterial===undefined){} });
      // restore real materials
      dragEntry.inst.traverse(c=>{ if(c.isMesh){ if(!c.userData.origMat) c.userData.origMat = null; } });
      const proto = protos[b.id];
      const idx = dragEntry.inst;
      // simplest: replace with fresh clone from proto
      scene.remove(idx);
      const inst = proto.clone();
      const w = rot%2?b.d:b.w, d = rot%2?b.w:b.d;
      inst.position.set((dragEntry.gx+w/2)*CELL, 0, (dragEntry.gz+d/2)*CELL);
      inst.rotation.y = rot*Math.PI/2;
      scene.add(inst);
      dragEntry.inst = inst;
      dragEntry.cells = cellsFor(dragEntry.gx, dragEntry.gz, b, rot);
      dragEntry.cells.forEach(k=>occ[k]=dragEntry);
    } else {
      // bounce back
      scene.remove(dragEntry.inst);
      const inst = protos[b.id].clone();
      const b0 = dragOrig;
      inst.position.set(b0.x, 0, b0.z);
      scene.add(inst);
      dragEntry.inst = inst;
      dragEntry.cells = dragOrig.cells;
      dragEntry.cells.forEach(k=>occ[k]=dragEntry);
    }
    dragEntry = null;
  }
  mode = 'none';
});
dom.addEventListener('contextmenu', e => e.preventDefault());
dom.addEventListener('wheel', e => { e.preventDefault(); camR = Math.min(55, Math.max(7, camR + e.deltaY*0.02)); applyCam(); }, {passive:false});
document.getElementById('zin').onclick = () => { camR = Math.max(7, camR-4); applyCam(); };
document.getElementById('zout').onclick = () => { camR = Math.min(55, camR+4); applyCam(); };
applyCam(); resize();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene, cam); })();
</script></body></html>
