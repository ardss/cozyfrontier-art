<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CozyFrontier 画风实验场 — 渐变低模方案对比</title>
<style>
  body { margin:0; background:#1a1d24; color:#d8d4c8; font-family:"Segoe UI",sans-serif; }
  h1 { font-size:20px; padding:14px 20px 4px; }
  .sub { padding:0 20px 10px; color:#8a8778; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:0 20px 30px; }
  .cell { background:#22262f; border-radius:10px; overflow:hidden; }
  .cell h2 { font-size:14px; margin:0; padding:10px 14px; font-weight:600; }
  .cell p { font-size:12px; margin:0; padding:0 14px 10px; color:#8a8778; line-height:1.5; }
  canvas { display:block; width:100%; }
</style>
</head>
<body>
<h1>CozyFrontier 画风实验场</h1>
<div class="sub">同一场景（农田+谷仓+风车+树+村民）× 5 种渲染方案。结论见每个面板说明。Mesh 为程序化低模：顶点色 + 硬边 flat shading，无贴图。</div>
<div class="grid" id="grid"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---- 候选调色板（20色内，模拟全局调色板约束）----
const PALETTES = {
  warmCozy: {  // 高饱和暖调（推荐候选：Sunhaven/Dinkum 式暖阳感）
    grass:0x7cb45b, grassDark:0x5e9145, dirt:0x9a6b45, dirtWet:0x7d5436,
    wood:0xa4713f, woodDark:0x7d5430, roof:0xc7563e, wall:0xf0e0bd,
    leaf:0x4f9e4f, leafDark:0x3d7d3f, stone:0x9d9a90, water:0x5aa7c7,
    cloth:0xe8b04b, skin:0xe8c39a, sky:0xa8d8e8
  },
  mutedPastel: { // 低饱和粉彩（cozy 常见但易灰）
    grass:0x93b57e, grassDark:0x77996a, dirt:0xa88a6d, dirtWet:0x8c7057,
    wood:0xb08a63, woodDark:0x8c6c4c, roof:0xc97e6e, wall:0xefe4cd,
    leaf:0x7aa878, leafDark:0x628b62, stone:0xa8a49a, water:0x82b3c4,
    cloth:0xe3c07c, skin:0xeccaa8, sky:0xbcd9dd
  },
  vividGamey: {  // 高饱和游戏感（forager式，浓烈）
    grass:0x63c74d, grassDark:0x4e9e3c, dirt:0x8a5a3b, dirtWet:0x6f4830,
    wood:0xa06a3c, woodDark:0x7c502c, roof:0xd94f3a, wall:0xf7e7c3,
    leaf:0x3fae49, leafDark:0x2f8a3a, stone:0x8f9194, water:0x3fa9dc,
    cloth:0xf2b53c, skin:0xf0c9a0, sky:0x8fd4f0
  }
};

// ---- 工具：顶点色低模构建 ----
function flatGeo(geo, color) {
  // 硬边 flat：toNonIndexed 保证每面法线独立
  const g = geo.toNonIndexed();
  g.computeVertexNormals();
  const c = new THREE.Color(color);
  const n = g.attributes.position.count;
  const colors = new Float32Array(n*3);
  for (let i=0;i<n;i++){ colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(colors,3));
  return g;
}
// gradient low-poly 核心：底面压暗、顶面提亮 → 伪 AO/体积感
function gradientGeo(geo, color, strength=0.28) {
  const g = flatGeo(geo, color);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const col = g.attributes.color;
  const c = new THREE.Color(color), lo = c.clone().multiplyScalar(1-strength), hi = c.clone().lerp(new THREE.Color(0xffffff), strength*0.5);
  for (let i=0;i<pos.count;i++){
    const t = THREE.MathUtils.clamp(nor.getY(i)*0.5+0.5, 0, 1); // 法线朝上→亮
    const cc = lo.clone().lerp(hi, t);
    col.setXYZ(i, cc.r, cc.g, cc.b);
  }
  return g;
}
function mesh(geo, mat, x,y,z, ry=0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z); m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ---- 场景搭建（共享）----
function buildScene(P, opts) {
  const useGrad = opts.gradient;
  const V = useGrad ? gradientGeo : flatGeo;
  const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.95, metalness:0, flatShading:false });

  const s = new THREE.Scene();
  s.background = new THREE.Color(P.sky);
  if (opts.fog) s.fog = new THREE.Fog(P.sky, 30, 75);

  // 地形：起伏地块（低模丘陵）
  const groundGeo = new THREE.PlaneGeometry(60, 60, 12, 12);
  groundGeo.rotateX(-Math.PI/2);
  const gp = groundGeo.attributes.position;
  for (let i=0;i<gp.count;i++){
    const x=gp.getX(i), z=gp.getZ(i);
    const edge = Math.max(Math.abs(x),Math.abs(z));
    gp.setY(i, edge>24 ? Math.sin(x*0.4)*Math.cos(z*0.35)*2.2*(edge-24)/6 : 0);
  }
  s.add(mesh(V(groundGeo, P.grass), mat, 0,0,0));

  // 农田：犁沟田垄 + 作物
  for (let fx=0; fx<3; fx++) for (let fz=0; fz<2; fz++) {
    const bx = -10+fx*7, bz = 2+fz*7;
    const soilGeo = new THREE.BoxGeometry(6, 0.4, 6);
    s.add(mesh(V(soilGeo, P.dirt), mat, bx, 0.2, bz));
    for (let i=0;i<4;i++) { // 田垄条纹（压暗）
      const rowGeo = new THREE.BoxGeometry(5.6, 0.12, 0.9);
      const rm = mesh(flatGeo(rowGeo, P.dirtWet), mat, bx, 0.45, bz-2.1+i*1.4);
      rm.castShadow=false; s.add(rm);
    }
    for (let i=0;i<5;i++) for (let j=0;j<4;j++) { // 作物小簇
      const cropGeo = new THREE.ConeGeometry(0.28, 0.9, 5);
      s.add(mesh(V(cropGeo, i%2? P.leaf : P.leafDark), mat, bx-2.2+i*1.1, 0.85, bz-1.6+j*1.05));
    }
  }

  // 谷仓（低模：墙+坡屋顶+门）
  const gx=12, gz=-6;
  s.add(mesh(V(new THREE.BoxGeometry(6,3.4,5), P.wall), mat, gx,1.7,gz));
  const roofGeo = new THREE.CylinderGeometry(0.01, 4.1, 2.4, 4, 1);
  roofGeo.rotateY(Math.PI/4);
  s.add(mesh(V(roofGeo, P.roof), mat, gx, 4.6, gz, Math.PI/4*0));
  s.add(mesh(V(new THREE.BoxGeometry(1.6,2.2,0.2), P.woodDark), mat, gx,1.1,gz+2.55));
  s.add(mesh(V(new THREE.BoxGeometry(7,0.5,6), P.wood), mat, gx,0.25,gz)); // 地基

  // 风车
  const wx=-16, wz=-10;
  s.add(mesh(V(new THREE.CylinderGeometry(1.2,1.7,7,6), P.wall), mat, wx,3.5,wz));
  s.add(mesh(V(new THREE.ConeGeometry(1.35,1.6,6), P.roof), mat, wx,7.8,wz));
  const hub = new THREE.Group();
  for (let i=0;i<4;i++){
    const bl = mesh(V(new THREE.BoxGeometry(0.35,4.4,0.12), P.cloth), mat, 0,2.2,0);
    const arm = new THREE.Group(); arm.add(bl); arm.rotation.z = i*Math.PI/2;
    hub.add(arm);
  }
  hub.position.set(wx,6.6,wz+1.55); hub.name='windmill'; s.add(hub);

  // 树×2种：锥形树 vs 交叉面植被
  function coneTree(x,z,scale=1){
    const g = new THREE.Group();
    g.add(mesh(V(new THREE.CylinderGeometry(0.28,0.4,1.4,5), P.woodDark), mat, 0,0.7,0));
    g.add(mesh(V(new THREE.IcosahedronGeometry(1.5,0), P.leaf), mat, 0,2.4,0));
    g.add(mesh(V(new THREE.IcosahedronGeometry(1.0,0), P.leafDark), mat, 0.5,3.1,0.3));
    g.scale.setScalar(scale); g.position.set(x,0,z); s.add(g);
  }
  function crossTree(x,z,scale=1){ // billboard 交叉面：alpha 伐木面片（此处用双色平面演示结构）
    const g = new THREE.Group();
    const lm = new THREE.MeshStandardMaterial({ color:P.leaf, roughness:1, side:THREE.DoubleSide, alphaTest:0.5, transparent:true });
    const cm = new THREE.MeshStandardMaterial({ color:P.woodDark, roughness:1, side:THREE.DoubleSide });
    for (let i=0;i<2;i++){
      const pl = mesh(new THREE.PlaneGeometry(3.4,3.4), lm, 0,2.7,0);
      pl.rotation.y = i*Math.PI/4; g.add(pl);
    }
    g.add(mesh(new THREE.CylinderGeometry(0.22,0.3,1.8,5), cm, 0,0.9,0));
    g.scale.setScalar(scale); g.position.set(x,0,z); s.add(g);
  }
  const treeFn = opts.crossTrees ? crossTree : coneTree;
  [[-4,-14,1.2],[20,4,1],[-22,6,1.4],[8,14,0.9],[-14,14,1.1],[16,14,1.3],[24,-14,1]].forEach(a=>treeFn(...a));

  // 石头与栅栏
  [[5,-3,0.5],[-8,8,0.7],[18,-2,0.4]].forEach(([x,z,r])=>
    s.add(mesh(V(new THREE.DodecahedronGeometry(r,0), P.stone), mat, x,r*0.6,z)));
  for (let i=0;i<8;i++){
    s.add(mesh(V(new THREE.BoxGeometry(0.18,0.9,0.18), P.woodDark), mat, -13+i*1.8, 0.45, 19));
  }
  s.add(mesh(V(new THREE.BoxGeometry(14.6,0.14,0.14), P.woodDark), mat, -6.5, 0.8, 19));

  // 水塘
  const pond = mesh(V(new THREE.CircleGeometry(4,9).rotateX(-Math.PI/2), P.water), mat, 12, 0.06, 10);
  pond.castShadow=false; s.add(pond);

  // 村民（低模人：身体+头+帽，验证 cloth/skin 调色）
  function villager(x,z,ry,cloth){
    const g = new THREE.Group();
    g.add(mesh(V(new THREE.CylinderGeometry(0.45,0.6,1.5,6), cloth), mat, 0,0.75,0));
    g.add(mesh(V(new THREE.SphereGeometry(0.42,7,6), P.skin), mat, 0,1.85,0));
    g.add(mesh(V(new THREE.ConeGeometry(0.55,0.5,6), P.woodDark), mat, 0,2.3,0));
    g.position.set(x,0,z); g.rotation.y=ry; s.add(g);
  }
  villager(-2,-4,0.7,P.cloth); villager(2,-5,-0.5,P.roof); villager(-5,-6,1.2,P.water);

  // 光照：单方向光 + 阴影 + 半球环境光
  const sun = new THREE.DirectionalLight(0xfff2dd, opts.sunIntensity ?? 2.6);
  sun.position.set(18, 26, 12); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  const d=34; sun.shadow.camera.left=-d; sun.shadow.camera.right=d; sun.shadow.camera.top=d; sun.shadow.camera.bottom=-d;
  s.add(sun);
  s.add(new THREE.HemisphereLight(P.sky, P.grassDark, opts.hemiIntensity ?? 1.1));
  return s;
}

// ---- 相机：固定45°俯视（2.5D上帝视角模拟）----
function makeCamera(){
  const cam = new THREE.PerspectiveCamera(42, 16/9, 0.1, 200);
  cam.position.set(0, 26, 22); cam.lookAt(0,0,-2);
  return cam;
}

// ---- 实验矩阵 ----
const EXPERIMENTS = [
  { id:'a', title:'方案A · 纯 flat + ACES + 暖调板（对照组）', desc:'无顶点渐变。ACES tonemapping 会把高饱和色板灰化压暗——注意屋顶红与草地绿的饱和度损失。这就是"不用 ACES"结论的实证。',
    palette:'warmCozy', opts:{ gradient:false, tone:THREE.ACESFilmicToneMapping, fog:true } },
  { id:'b', title:'方案B · 渐变低模 + Neutral + 暖调板（推荐）', desc:'顶点色 AO 渐变 + Neutral tonemapping + 距离雾。色彩保持高饱和，体积感来自几何渐变而非贴图。推荐基线方案。',
    palette:'warmCozy', opts:{ gradient:true, tone:THREE.NeutralToneMapping, fog:true } },
  { id:'c', title:'方案C · 渐变低模 + 粉彩低饱和板', desc:'同方案B，仅换低饱和粉彩调色板。更"软"但对比度下降，远景与草地容易糊成一片——cozy 不等于灰。',
    palette:'mutedPastel', opts:{ gradient:true, tone:THREE.NeutralToneMapping, fog:true } },
  { id:'d', title:'方案D · 渐变低模 + 高饱和游戏感板', desc:'同方案B，换 Forager 式浓烈色板。最抓眼球，但长时间注视易疲劳，且与"治愈"调性冲突。适合节日/季节变体而非基线。',
    palette:'vividGamey', opts:{ gradient:true, tone:THREE.NeutralToneMapping, fog:true } },
  { id:'e', title:'方案E · 方案B + 交叉面植被 + 无雾', desc:'树换成 billboard 交叉面片（XX结构）。近距离观感取决于贴图质量，程序化纯色时明显不如锥形低模树；无雾则远景生硬。→ 植被用低模几何体更稳。',
    palette:'warmCozy', opts:{ gradient:true, tone:THREE.NeutralToneMapping, fog:false, crossTrees:true, sunIntensity:2.9 } },
];

const grid = document.getElementById('grid');
const done = [];
for (const exp of EXPERIMENTS) {
  const cell = document.createElement('div');
  cell.className='cell';
  cell.innerHTML = `<h2>${exp.title}</h2><canvas></canvas><p>${exp.desc}</p>`;
  grid.appendChild(cell);
  const canvas = cell.querySelector('canvas');
  canvas.width = 960; canvas.height = 540;

  const r = new THREE.WebGLRenderer({ canvas, antialias:true });
  r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.toneMapping = exp.opts.tone; r.toneMappingExposure = 1.0;
  r.outputColorSpace = THREE.SRGBColorSpace;
  const scene = buildScene(PALETTES[exp.palette], exp.opts);
  const cam = makeCamera();
  // 渲染两帧：风车转一下以示活物
  scene.getObjectByName('windmill').rotation.y = 0.3;
  r.render(scene, cam);
  done.push(exp.id);
}
document.title = '风格实验场 渲染完成 ' + done.join(',');
</script>
</body>
</html>
